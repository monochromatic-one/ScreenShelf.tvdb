<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝕾𝖈𝖗𝖊𝖊𝖓𝕾𝖍𝖊𝖑𝖋 🍥</title>
<meta name="theme-color" content="#121319">
<meta name="description" content="Track shows & anime — stays in your browser. TVDB + IndexedDB, no cloud.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScreenShelf">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="ScreenShelf 🍥">
<meta property="og:description" content="Track shows & anime — stays in your browser.">
<meta property="og:type" content="website">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#121319; --surface:#1a1c24; --surface-2:#21232d; --surface-3:#282b37;
    --text:#edeef3; --muted:#90939f; --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14);
    --accent:#e3a23b; --accent-text:#1a1206; --danger:#e0616b; --shadow: 0 12px 32px rgba(0,0,0,.35);
    --scrim: rgba(8,9,12,.6);
  }
  :root[data-theme="light"]{
    --bg:#f5f3ee; --surface:#ffffff; --surface-2:#efece4; --surface-3:#e6e2d8;
    --text:#1c1c1a; --muted:#6d6a62; --border:rgba(20,18,10,.09); --border-strong:rgba(20,18,10,.16);
    --accent:#c47f1f; --accent-text:#fffaf0; --danger:#b6414c; --shadow: 0 12px 28px rgba(30,25,10,.12);
    --scrim: rgba(30,26,16,.4);
  }
  .status-watching{ --status-color:#e3a23b; }
  .status-planned{ --status-color:#5fa3a0; }
  .status-comeback{ --status-color:#9b8ce0; }
  .status-finished{ --status-color:#6fa679; }
  .status-dropped{ --status-color:#c97b84; }
  .status-returning{--status-color:#9b8ce0;}
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  img{ display:block; max-width:100%; }
  ::selection{ background:var(--accent); color:var(--accent-text); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  .app-shell{ min-height:100%; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px; background:linear-gradient(var(--bg) 65%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ font-size:20px; }
  .brand-name{ font-size:25.5px; font-weight:800; letter-spacing:.01em; }
  .brand-screen{ color:var(--text); }
  .brand-shelf{ color:var(--accent); }
  .topbar-actions{ display:flex; gap:6px; }
  .icon-btn{
    position:relative; width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); font-size:17px; display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ transform: scale(.94); }
  .badge{
    position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
    background:var(--accent); color:var(--accent-text); font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .main{ flex:1; padding: 4px 16px 96px; max-width:720px; width:100%; margin:0 auto; }
  @media (min-width: 860px){ .main{ max-width: 820px; padding-left:0; padding-right:0; } }
  .hero-glow{
    height:1px; margin: 2px 0 18px; background:
      radial-gradient(60% 100% at 20% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    height:64px; margin-top:-64px; pointer-events:none; position:relative; z-index:-1;
  }
  .status-section{ border-top:1px solid var(--border); }
  .status-section:last-child{ border-bottom:1px solid var(--border); }
  .status-header{
    width:100%; display:flex; align-items:center; gap:10px; background:none; border:none;
    padding:15px 4px; text-align:left; font-size:15.5px; font-weight:700; color:var(--text);
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--status-color); flex:none; }
  .status-emoji{ font-size:16px; }
  .status-count{ margin-left:auto; color:var(--muted); font-weight:600; font-size:13.5px; }
  .status-caret{ color:var(--muted); font-size:12px; transition:transform .18s ease; margin-left:2px; }
  .status-header[aria-expanded="true"] .status-caret{ transform:rotate(90deg); }
  .status-list{ display:grid; grid-template-rows:0fr; overflow:hidden; transition:grid-template-rows .25s ease; }
  .status-list.open{ grid-template-rows:1fr; }
  .status-list-inner{ min-height:0; overflow:hidden; padding-bottom:10px; }
  .status-empty{ color:var(--muted); font-size:13.5px; padding:14px 4px 20px; text-align:center; line-height:1.5; }
  .main.main-flex-fill{ display:flex; flex-direction:column; }
  .watched-time-stat{ text-align:center; padding:26px 12px 10px; margin-top:auto; }
  .watched-time-main{ font-size:12.5px; }
  .watched-time-label{ font-weight:700; color:var(--muted); }
  .watched-time-value{ font-weight:400; color:var(--muted); }
  .watched-time-sub{ font-size:11px; color:var(--muted); opacity:.75; margin-top:3px; }
  .anime-row{
    width:100%; display:flex; align-items:center; gap:12px; background:none; border:none; border-top:1px solid var(--border);
    padding:9px 4px; text-align:left;
  }
  .status-list-inner .anime-row:first-child{ border-top:none; }
  .anime-row:hover{ background:var(--surface); border-radius:10px; }
  .poster-thumb{
    width:40px; height:56px; border-radius:6px; object-fit:cover; background:var(--surface-2); flex:none;
    border:1px solid var(--border);
  }
  .anime-title{ font-size:14.5px; font-weight:600; line-height:1.3; }
  .own-library-row .anime-title-wrap{ min-width:0; flex:1; }
  .own-library-row{ position:relative; }
  .own-library-row .anime-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .library-rating{ width:15px; flex:none; color:var(--muted); font-size:15px; line-height:1; text-align:center; }
  .title-update-dot{
    position:absolute; z-index:2; width:9px; height:9px; border:1.5px solid var(--surface); border-radius:50%;
    background:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .own-library-row .title-update-dot{ top:8px; right:5px; }
  .library-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; padding:0 4px; }
  .library-grid-tile{
    position:relative; display:block; min-width:0; padding:0; overflow:hidden; text-align:left;
    background:transparent; border:0; border-radius:8px; color:var(--text);
  }
  .library-grid-tile:active{ transform:scale(.98); }
  .library-grid-poster{
    width:100%; aspect-ratio:2/3; border:1px solid var(--border); border-radius:8px;
    background:var(--surface-2); object-fit:cover;
  }
  .library-grid-title{
    display:block; overflow:hidden; margin-top:6px; color:var(--text); font-size:12px; font-weight:600;
    line-height:1.3; text-overflow:ellipsis; white-space:nowrap;
  }
  .library-grid-rating{
    position:absolute; top:5px; right:5px; display:flex; align-items:center; justify-content:center;
    min-width:24px; min-height:24px; padding:2px; border:1px solid var(--border-strong); border-radius:999px;
    background:color-mix(in srgb, var(--surface) 90%, transparent); box-shadow:0 2px 6px rgba(0,0,0,.2);
    font-size:14px; line-height:1;
  }
  .library-grid-tile .title-update-dot{ top:6px; right:6px; }
  .library-grid-tile.has-title-update .library-grid-rating{ right:22px; }
  .empty-block{ padding:56px 10px; text-align:center; }
  .empty-emoji{ font-size:34px; margin-bottom:10px; }
  .empty-title{ font-weight:700; font-size:16px; margin-bottom:6px; }
  .empty-text{ color:var(--muted); font-size:14px; max-width:320px; margin:0 auto 18px; line-height:1.5; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; border:1px solid transparent;
    padding:11px 18px; font-weight:700; font-size:14px; transition: filter .15s ease, transform .1s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-accent{ background:var(--accent); color:var(--accent-text); }
  .btn-accent:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:color-mix(in srgb, var(--danger) 12%, transparent); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
  .view-head{ display:flex; align-items:center; gap:10px; padding:10px 4px 6px; }
  .back-btn{
    background:var(--accent); border:1px solid var(--accent); color:var(--accent-text);
    font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px;
    padding:8px 11px; border-radius:10px;
  }
  .back-btn:hover{ filter:brightness(1.08); }
  .view-title{ font-size:16px; font-weight:800; }
  .settings-view-head .view-title{ margin-left:auto; }
  .search-box{ display:flex; gap:8px; padding:6px 4px 16px; position:sticky; top:66px; background:var(--bg); z-index:5; }
  .search-input{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px;
    font-size:14.5px; color:var(--text);
  }
  .search-input:focus{ border-color:var(--accent); }
  .search-hint{ color:var(--muted); font-size:13.5px; padding:8px 6px 20px; line-height:1.5; }
  .search-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:14px; padding:4px; }
  .search-card{ background:none; border:none; text-align:left; padding:0; }
  .search-poster{ width:100%; aspect-ratio:2/3; border-radius:10px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); margin-bottom:7px; }
  .search-card-title{ font-size:13px; font-weight:600; line-height:1.3; }
  .search-card-owned{ font-size:11px; color:var(--accent); font-weight:700; margin-top:2px; }
  .detail-hero{ text-align:center; padding:6px 4px 18px; }
  .detail-title{ font-size:19px; font-weight:800; margin:0 0 16px; line-height:1.3; }
  .detail-poster-wrap{ position:relative; max-width:230px; margin:0 auto; }
  .detail-poster{ width:100%; aspect-ratio:2/3; border-radius:16px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); box-shadow:var(--shadow); }
  .detail-stats{
    display:inline-flex; gap:8px; align-items:center; margin-top:14px; background:var(--surface); border:1px solid var(--border);
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--muted);
  }
  .detail-stats b{ color:var(--text); }
  .detail-genres{ display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin:10px auto 0; max-width:480px; }
  .detail-genre{ padding:4px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--muted); font-size:11px; font-weight:700; line-height:1.2; }
  .tvdb-score{ display:flex; align-items:center; justify-content:center; gap:5px; margin-top:9px; font-size:12px; color:var(--muted); font-weight:700; }
  .tvdb-score-mark{ color:#2b6cb0; font-size:10px; font-weight:900; letter-spacing:-.35px; }
  .detail-tvdb-status{ margin-top:9px; font-size:12.5px; color:var(--muted); }
  .detail-actions{ padding:8px 4px 22px; display:flex; flex-direction:column; gap:10px; }
  .status-pill{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; padding:7px 13px 7px 10px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border); align-self:center;
  }
  .status-pill .status-dot{ width:7px; height:7px; }
  .detail-meta-row{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .rating-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:7px 13px 7px 10px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--muted);
  }
  .rating-pill:hover{ background:var(--surface-2); }
  .rating-pill .rating-emoji{ font-size:15px; color:var(--text); }
  .section-label{ font-size:12.5px; font-weight:700; color:var(--muted); padding:18px 4px 8px; }
  .season-row{ border-top:1px solid var(--border); }
  .season-head{ width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; padding:13px 4px; text-align:left; }
  .season-name{ font-size:14.5px; font-weight:600; flex:1; }
  .season-check{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border-strong); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--surface);
  }
  .season-check.checked{ background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
  .tvdb-title-link{
    display:inline-flex; align-items:center; justify-content:center; margin-top:10px; padding:6px 10px;
    border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--accent);
    font-size:11.5px; font-weight:800; text-decoration:none;
  }
  .tvdb-title-link:hover{ background:var(--surface-2); }
  .tvdb-refresh-time{ padding:24px 4px 8px; color:var(--muted); text-align:center; font-size:11.5px; line-height:1.4; }
  .tvdb-sync-status{ padding:4px 4px 12px; color:var(--muted); text-align:center; font-size:11.5px; }
  .profile-row{ display:flex; align-items:center; gap:16px; }
  .avatar-wrap{
    position:relative; width:64px; height:64px; border-radius:50%; flex:none;
    background:var(--surface-2); border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .avatar-img{ width:100%; height:100%; object-fit:cover; display:none; }
  .avatar-img.has-photo{ display:block; }
  .avatar-fallback{ font-size:26px; }
  .avatar-wrap.uploading::after{ content:''; position:absolute; inset:0; background:var(--scrim); }
  .avatar-spinner{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:16px; }
  .avatar-wrap.uploading .avatar-spinner{ display:flex; }
  .profile-info{ flex:1; min-width:0; }
  .profile-name-row{ display:flex; align-items:center; gap:8px; }
  .profile-name{ font-size:15.5px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .name-edit-btn{ background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:700; padding:2px 4px; flex:none; }
  .profile-name-edit-row{ display:flex; gap:6px; align-items:center; }
  .profile-name-input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:7px 10px; font-size:14px; min-width:0; }
  .profile-name-input:focus{ border-color:var(--accent); }
  .profile-name-save{ background:var(--accent); color:var(--accent-text); border:none; border-radius:9px; padding:7px 10px; font-size:12.5px; font-weight:700; flex:none; }
  .profile-name-cancel{ background:none; border:none; color:var(--muted); font-size:12.5px; padding:7px 6px; flex:none; }
  .profile-email{ font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .change-pic-btn{ margin-top:10px; }
  .avatar-error{ font-size:12px; color:var(--danger); margin-top:8px; }
  .field{ margin-bottom:18px; }
  .field-label{ font-size:13px; font-weight:700; margin-bottom:7px; display:block; }
  .field-help{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .field-input{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 13px; font-size:14px; }
  .field-input:focus{ border-color:var(--accent); }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .test-status{ font-size:12.5px; margin-top:9px; font-weight:600; }
  .test-status.ok{ color:#6fa679; }
  .test-status.err{ color:var(--danger); }
  .theme-row{ display:flex; gap:10px; }
  .theme-opt{ flex:1; padding:12px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); text-align:center; font-size:13px; font-weight:700; }
  .theme-opt.active{ border-color:var(--accent); color:var(--accent); }
  .swatches{ display:flex; gap:9px; flex-wrap:wrap; margin-top:2px; }
  .swatch{ width:30px; height:30px; border-radius:9px; border:2px solid transparent; }
  .swatch.active{ border-color:var(--text); }
  .divider{ height:1px; background:var(--border); margin:22px 0; }
  .import-export-row{ display:flex; gap:10px; }
  .import-export-row .btn{ flex:1; }
  .overlay{
    position:fixed; inset:0; background:var(--scrim); z-index:50; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){ .overlay{ align-items:center; } }
  .sheet{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:20px 20px 0 0;
    padding: 8px 8px max(20px, env(safe-area-inset-bottom)); box-shadow:var(--shadow);
    transform:translateY(16px); transition:transform .18s ease;
  }
  .overlay.show .sheet{ transform:translateY(0); }
  @media (min-width:640px){ .sheet{ border-radius:20px; } }
  .sheet-grip{ width:36px; height:4px; border-radius:2px; background:var(--border-strong); margin:6px auto 12px; }
  .sheet-title{ font-size:15px; font-weight:800; padding:0 10px 14px; }
  .sheet-text{ font-size:13.5px; color:var(--muted); padding:0 10px 16px; line-height:1.5; }
  .status-choice{
    width:100%; display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:12px; border:none; background:none;
    text-align:left; font-size:14.5px; font-weight:600;
  }
  .status-choice:hover{ background:var(--surface-2); }
  .status-choice.current{ color:var(--accent); }
  .status-choice .status-dot{ width:9px; height:9px; }
  .rating-choice{
    width:100%; display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:12px; border:none; background:none;
    text-align:left; font-size:14.5px; font-weight:600;
  }
  .rating-choice:hover{ background:var(--surface-2); }
  .rating-choice.current{ background:var(--surface-2); color:var(--accent); }
  .rating-choice .rating-choice-emoji{ font-size:19px; }
  .sheet-actions{ display:flex; gap:10px; padding:6px 10px 4px; }
  .sheet-actions .btn{ flex:1; }
  .notif-empty{ padding:44px 20px; text-align:center; color:var(--muted); font-size:13.5px; }
  .notif-item{ padding:13px 10px; border-top:1px solid var(--border); display:flex; gap:11px; }
  .notif-list .notif-item:first-child{ border-top:none; }
  .notif-item.unread{ background:color-mix(in srgb, var(--accent) 7%, transparent); border-radius:10px; }
  .notif-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none; }
  .notif-dot.read{ background:transparent; }
  .notif-body{ flex:1; }
  .notif-title{ font-size:13.5px; font-weight:700; line-height:1.4; }
  .notif-time{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .notif-delete{
    width:32px; height:32px; flex:none; align-self:center; border:1px solid var(--border);
    border-radius:9px; background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-size:13px; padding:0; opacity:.72;
  }
  .notif-delete:hover{ background:var(--surface-2); opacity:1; }
  .spinner{ font-size:30px; display:inline-block; animation:spin 1.1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-block{ padding:70px 0; text-align:center; color:var(--muted); }
  .loading-block .spinner{ margin-bottom:10px; }
  .inline-loading{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; padding:14px 4px; }
  .inline-loading .spinner{ font-size:18px; }

<script type="module">
/* =========================================================
   ScreenShelf — TVDB + IndexedDB Local Edition
   No Firebase. No accounts. Everything stays in this browser.
========================================================= */
'use strict';

/* ---------- Constants ---------- */
const STATUSES = [
  { key:'watching', label:'Watching',      emoji:'⛩️' },
  { key:'planned',  label:'Planned',       emoji:'🍿' },
  { key:'comeback', label:'Coming back?',  emoji:'🤷' },
  { key:'finished', label:'Finished',      emoji:'✅' },
  { key:'dropped',  label:'Dropped',       emoji:'🗑️' },
];
const STATUS_MAP = Object.fromEntries(STATUSES.map(s=>[s.key,s]));
const SHOW_STATUSES = [
  { key:'watching', label:'Watching', emoji:'🍿' },
  { key:'planned', label:'Planned', emoji:'📋' },
  { key:'returning', label:'Returning', emoji:'🔄' },
  { key:'finished', label:'Finished', emoji:'✅' },
  { key:'dropped', label:'Dropped', emoji:'🗑️' },
];
const SHOW_STATUS_MAP = Object.fromEntries(SHOW_STATUSES.map(s=>[s.key,s]));
const RATINGS = [
  { key:'hot',  label:'PEAK',      emoji:'♨️' },
  { key:'good', label:'Go for it', emoji:'😌' },
  { key:'okay', label:'Timepass',  emoji:'🫠' },
  { key:'bad',  label:'Skip',      emoji:'😫' },
];
const RATING_MAP = Object.fromEntries(RATINGS.map(r=>[r.key,r]));
const RATING_UNSET_EMOJI = '❓';
const ANIME_FALLBACK_RUNTIME_MIN = 24;
const SERIES_FALLBACK_RUNTIME_MIN = 50;
const TVDB_BASE = 'https://api4.thetvdb.com/v4';
const ACCENTS = ['#e3a23b','#9b8ce0','#5fa3a0','#c97b84','#6fa679','#7f9fe0'];
const PLACEHOLDER_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="100%" height="100%" fill="#272a35"/><text x="50%" y="52%" font-size="46" text-anchor="middle" fill="#565a6b" font-family="sans-serif">🎬</text></svg>'
);

/* ---------- App state ---------- */
const state = {
  library: [],
  showLibrary: [],
  activeTab: 'shows',
  settings: { tvdbApiKey:'', tvdbPin:'', tmdbApiKey:'', theme:'dark', accent: ACCENTS[0], displayName:'', photoURL:'', showLibraryRatings:false },
  editingProfileName: false,
  avatarUploading: false,
  avatarError: '',
  notifications: [],
  homeScrollY: null,
  expandedStatus: null,
  view: 'home',
  detailId: null,
  searchQuery: '',
  searchResults: [],
  searchLoading: false,
  searchError: '',
  detailLoading: false,
  previewMode: false,
  previewTvdb: null,
  refreshing: false,
  sortBy: { anime: 'az', shows: 'az' },
  libraryView: 'list',
};

function uid(){
  return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   IndexedDB — single source of truth (replaces Firestore)
========================================================= */
const DB_NAME = 'screenshelf-tvdb-local';
const DB_VERSION = 4;
let dbPromise = null;
function getDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      const oldVersion = e.oldVersion;
      if(!db.objectStoreNames.contains('profile')) db.createObjectStore('profile',{keyPath:'id'});
      if(!db.objectStoreNames.contains('anime')) db.createObjectStore('anime',{keyPath:'id'});
      if(!db.objectStoreNames.contains('series')) db.createObjectStore('series',{keyPath:'id'});
      if(!db.objectStoreNames.contains('notifications')) db.createObjectStore('notifications',{keyPath:'id'});
      if(!db.objectStoreNames.contains('animationCache')) db.createObjectStore('animationCache',{keyPath:'id'});
      if(!db.objectStoreNames.contains('tmdbRatingCache')) db.createObjectStore('tmdbRatingCache',{keyPath:'id'});
      if(oldVersion<4 && db.objectStoreNames.contains('companionMovies')) db.deleteObjectStore('companionMovies');
      // v1 -> v2/v3/v4 migrations happen automatically (new stores are created and retired stores are removed)
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
    req.onblocked = ()=> console.warn('IndexedDB blocked');
  });
  return dbPromise;
}
async function idbGetAll(store){
  const db = await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).getAll();
    req.onsuccess=()=>res(req.result||[]);
    req.onerror=()=>rej(req.error);
  });
}
async function idbGet(store,key){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).get(key);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function idbPut(store,value){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}
async function idbDelete(store,key){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}

/* ---------- Helpers: Japanese detection & English picking ---------- */
const CJK_RE = /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9faf\uac00-\ud7af]/;
function hasJapanese(text){ return typeof text==='string' && CJK_RE.test(text); }
function pickEnglishTitleFromSearch(r){
  // TVDB search may return Japanese in r.name; prefer English translation
  if(r.translations){
    if(typeof r.translations.eng==='string' && r.translations.eng.trim() && !hasJapanese(r.translations.eng)) return r.translations.eng.trim();
    if(typeof r.translations.en==='string' && r.translations.en.trim() && !hasJapanese(r.translations.en)) return r.translations.en.trim();
    // translations could be object with many langs — match only en / eng (not "fr-en" or "french")
    for(const [lang,val] of Object.entries(r.translations)){
      if(typeof val==='string' && val.trim() && !hasJapanese(val) && /^en(g)?$/i.test(String(lang).trim())) return val.trim();
    }
  }
  if(typeof r.name==='string' && r.name.trim() && !hasJapanese(r.name)) return r.name.trim();
  if(typeof r.extendedTitle==='string' && r.extendedTitle.trim() && !hasJapanese(r.extendedTitle)) return r.extendedTitle.trim();
  if(typeof r.slug==='string' && r.slug.trim()){
    // Title-case slug but keep small words lowercase (e.g. "Attack on Titan" not "Attack On Titan")
    const stop = new Set(['a','an','and','as','at','but','by','for','in','nor','of','on','or','the','to','with','vs','vs.','via']);
    const words = r.slug.replace(/-/g,' ').split(/\s+/).filter(Boolean);
    return words.map((w,i)=> {
      const lw = w.toLowerCase();
      if(i!==0 && stop.has(lw)) return lw;
      return lw.charAt(0).toUpperCase()+lw.slice(1);
    }).join(' ');
  }
  // Fallback: use whatever name we have (even Japanese) - better than empty
  return (r.name || r.extendedTitle || '').trim();
}
function pickEnglishNameFromExtended(tv){
  if(typeof tv.name==='string' && tv.name.trim() && !hasJapanese(tv.name)) return tv.name.trim();
  // Try nameTranslations
  if(tv.translations && Array.isArray(tv.translations.nameTranslations)){
    const en = tv.translations.nameTranslations.find(t=> t.language==='eng' && typeof t.name==='string' && t.name.trim() && !hasJapanese(t.name));
    if(en) return en.name.trim();
  }
  if(Array.isArray(tv.aliases)){
    const enAlias = tv.aliases.find(a=> {
      const n = a.name || a.alias;
      return typeof n==='string' && n.trim() && !hasJapanese(n) && (a.language==='eng' || a.language==='en' || !a.language);
    });
    if(enAlias) return (enAlias.name || enAlias.alias).trim();
  }
  if(typeof tv.slug==='string' && tv.slug.trim()){
    const stop = new Set(['a','an','and','as','at','but','by','for','in','nor','of','on','or','the','to','with','vs','vs.','via']);
    const words = tv.slug.replace(/-/g,' ').split(/\s+/).filter(Boolean);
    return words.map((w,i)=> {
      const lw = w.toLowerCase();
      if(i!==0 && stop.has(lw)) return lw;
      return lw.charAt(0).toUpperCase()+lw.slice(1);
    }).join(' ');
  }
  return (tv.name || '').trim();
}
function seasonDisplayName(s, fallbackNumber){
  if(typeof s.name==='string' && s.name.trim() && !hasJapanese(s.name)) return s.name.trim();
  return 'Season '+fallbackNumber;
}
const seasonNameCache = new Map();
const GENERIC_SEASON_NAME_RE = /^(?:season\s*\d+|aired\s+order|dvd\s+order|absolute\s+order|alternate(?:\s+dvd)?\s+order|regional\s+order|default\s+order)$/i;
function seasonNeedsTranslation(s, fallbackNumber){
  const name=seasonDisplayName(s,fallbackNumber);
  return !name || GENERIC_SEASON_NAME_RE.test(name.trim());
}
async function fetchEnglishSeasonName(s){
  const displayed=seasonDisplayName(s,s.number);
  const fallback=GENERIC_SEASON_NAME_RE.test(displayed.trim()) ? 'Season '+s.number : displayed;
  const seasonId=normalizeTvdbId(s&&s.id);
  if(!seasonNeedsTranslation(s,s.number) || seasonId==null) return fallback;
  if(seasonNameCache.has(seasonId)) return seasonNameCache.get(seasonId);
  let name=fallback;
  try{
    const json=await tvdbFetch('/seasons/'+seasonId+'/translations/eng',{});
    const candidate=json.data?.name;
    if(typeof candidate==='string' && candidate.trim() && !hasJapanese(candidate) && !GENERIC_SEASON_NAME_RE.test(candidate.trim())) name=candidate.trim();
  }catch(e){ console.warn('Season name lookup failed for',seasonId,e); }
  seasonNameCache.set(seasonId,name);
  return name;
}

/* ---------- Normalizers (local) ---------- */
const MAX_PROFILE_PHOTO_LENGTH = 300000;
const MAX_LIBRARY_TITLE_LENGTH = 240;
const MAX_SEASON_NAME_LENGTH = 160;

function normalizeText(value, maxLength){ return typeof value==='string'? value.trim().slice(0,maxLength):''; }
function boundedInteger(value,min,max,fallback){
  const n = typeof value==='number'?value:(typeof value==='string'&&/^\d+$/.test(value)?Number(value):NaN);
  return Number.isSafeInteger(n)&&n>=min&&n<=max? n: fallback;
}
function normalizeTvdbId(value){ return boundedInteger(value,1,2147483647,null); }
function normalizeProfilePhoto(value){
  if(typeof value!=='string') return '';
  return value==='' || (value.length<=MAX_PROFILE_PHOTO_LENGTH && /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(value)) ? value : '';
}
function normalizeSeason(v){
  if(!v||typeof v!=='object'||Array.isArray(v)) return null;
  const seasonNumber=boundedInteger(v.seasonNumber,1,1000,null);
  const episodeCount=boundedInteger(v.episodeCount,0,10000,null);
  if(seasonNumber==null||episodeCount==null) return null;
  return { seasonNumber, name: normalizeText(v.name,MAX_SEASON_NAME_LENGTH) || ('Season '+seasonNumber), episodeCount, watched: !!v.watched };
}
function normalizeTvdbGenres(value){
  if(!Array.isArray(value)) return [];
  const seen=new Set();
  return value.slice(0,20).map(g=>{
    const raw = typeof g==='string'? g : g && g.name;
    return normalizeText(raw,60);
  }).filter(n=>{ if(!n||seen.has(n)) return false; seen.add(n); return true; });
}
function normalizeLibraryItem(value, mediaType){
  if(!value||typeof value!=='object'||Array.isArray(value)) return null;
  // TVDB build: only accept tvdbId (or id as alias), not tmdbId — prevents TMDB ID namespace collision
  if(value.tmdbId!=null && value.tvdbId==null && value.id==null) return null;
  // If it looks like a TMDB-only payload (has tmdbId but no tvdbId and no explicit tvdbMeta), reject
  const hasTvdbId = value.tvdbId!=null || (value.id!=null && value.tmdbId==null);
  const tvdbId = normalizeTvdbId(value.tvdbId ?? value.id);
  if(tvdbId==null) return null;
  // Extra guard: if payload has tmdb-specific keys and no tvdbMeta, likely TMDB backup — skip
  if(!hasTvdbId && value.tmdbId!=null) return null;
  const title = normalizeText(value.title, MAX_LIBRARY_TITLE_LENGTH);
  if(tvdbId==null||!title) return null;
  const type = mediaType==='show'?'show':'anime';
  const statusMap = type==='show'? SHOW_STATUS_MAP: STATUS_MAP;
  const seasons = Array.isArray(value.seasons)? value.seasons.slice(0,100).map(normalizeSeason).filter(Boolean):[];
  const meta = value.tvdbMeta || value.tmdbMeta || {};
  // TVDB's score is a popularity/sort hint, not a 0–10 rating. Only accept
  // a TMDB average when a TMDB vote count is present (old TVDB-derived values
  // had no vote count and must not reappear as a rating badge).
  const rawTmdbVoteAverage = typeof meta.tmdbVoteAverage==='number' && Number.isFinite(meta.tmdbVoteAverage) && meta.tmdbVoteAverage>=0 && meta.tmdbVoteAverage<=10 ? meta.tmdbVoteAverage : null;
  const rawTmdbVoteCount = boundedInteger(meta.tmdbVoteCount,0,2147483647,null);
  const tmdbVoteAverage = rawTmdbVoteAverage!=null && rawTmdbVoteCount!=null ? rawTmdbVoteAverage : null;
  const tmdbVoteCount = tmdbVoteAverage!=null ? rawTmdbVoteCount : null;
  return {
    id: String(tvdbId),
    tvdbId,
    tmdbId: tvdbId, // alias for legacy code paths
    title,
    poster: typeof value.poster==='string'? value.poster.trim()||null : null,
    backdrop: typeof value.backdrop==='string'? value.backdrop.trim()||null : null,
    status: typeof value.status==='string'&&statusMap[value.status]? value.status:'planned',
    rating: typeof value.rating==='string'&&RATING_MAP[value.rating]? value.rating: null,
    mediaType: type,
    seasons,
    tvdbMeta: {
      numberOfSeasons: boundedInteger(meta.numberOfSeasons,0,1000,seasons.length),
      numberOfEpisodes: boundedInteger(meta.numberOfEpisodes,0,100000,0),
      tvdbStatus: normalizeText(meta.tvdbStatus||meta.tmdbStatus||'',120),
      tmdbStatus: normalizeText(meta.tmdbStatus||meta.tvdbStatus||'',120),
      episodeRuntime: boundedInteger(meta.episodeRuntime,1,1440,null),
      score: null,
      tmdbVoteAverage,
      tmdbVoteCount,
      tmdbRatingCheckedAt: boundedInteger(meta.tmdbRatingCheckedAt,0,4102444800000,null),
      genres: normalizeTvdbGenres(meta.genres),
      tvdbRefreshedAt: boundedInteger(meta.tvdbRefreshedAt||meta.tmdbRefreshedAt,0,4102444800000,null),
    },
    tmdbMeta: null, // will be duplicated for compat
    addedAt: typeof value.addedAt==='number'? value.addedAt: Date.now(),
    updatedAt: typeof value.updatedAt==='number'? value.updatedAt: Date.now(),
  };
}
function denormalizeForStorage(item){
  // keep tmdbMeta alias so old exports still render
  const clone = { ...item, tmdbMeta: item.tvdbMeta };
  return clone;
}

/* ---------- Local persistence helpers ---------- */
async function loadFromDB(){
  const [profile, animeRows, seriesRows, notifRows, animCacheRows, tmdbRatingRows] = await Promise.all([
    idbGet('profile','settings'),
    idbGetAll('anime'),
    idbGetAll('series'),
    idbGetAll('notifications'),
    idbGetAll('animationCache').catch(()=>[]),
    idbGetAll('tmdbRatingCache').catch(()=>[]),
  ]);
  // Restore persisted animation genres cache (speeds up search filtering)
  try{
    if(Array.isArray(animCacheRows)){
      animCacheRows.forEach(row=>{
        if(row && typeof row.id!=='undefined' && typeof row.isAnimated==='boolean'){
          // Only restore recent entries (< 60 days) to keep data fresh
          const age = Date.now() - (row.checkedAt||0);
          if(age < 60*24*60*60*1000) animationCache.set(Number(row.id), row.isAnimated);
        }
      });
    }
  }catch(e){ console.warn('Could not restore animation cache', e); }
  // Restore cached TMDB ratings. Null averages are retained as a cached no-match
  // so an unrecognized title is not requested on every render.
  try{
    if(Array.isArray(tmdbRatingRows)){
      tmdbRatingRows.forEach(row=>{
        const id=normalizeTvdbId(row&&row.id);
        const checkedAt=typeof row?.checkedAt==='number'?row.checkedAt:0;
        const voteAverage=typeof row?.voteAverage==='number'&&Number.isFinite(row.voteAverage)&&row.voteAverage>=0&&row.voteAverage<=10 ? row.voteAverage:null;
        const voteCount=boundedInteger(row?.voteCount,0,2147483647,null);
        if(id!=null && checkedAt>0) tmdbRatingCache.set(id,{id,voteAverage,voteCount,checkedAt});
      });
    }
  }catch(e){ console.warn('Could not restore TMDB rating cache', e); }
  if(profile){
    if(typeof profile.tvdbApiKey==='string') state.settings.tvdbApiKey = profile.tvdbApiKey;
    if(typeof profile.tvdbPin==='string') state.settings.tvdbPin = profile.tvdbPin;
    if(typeof profile.tmdbApiKey==='string') state.settings.tmdbApiKey = profile.tmdbApiKey;
    if(typeof profile.theme==='string') state.settings.theme = profile.theme;
    if(typeof profile.accent==='string') state.settings.accent = profile.accent;
    if(typeof profile.displayName==='string') state.settings.displayName = profile.displayName;
    if(typeof profile.photoURL==='string') state.settings.photoURL = normalizeProfilePhoto(profile.photoURL);
    if(typeof profile.showLibraryRatings==='boolean') state.settings.showLibraryRatings = profile.showLibraryRatings;
    // legacy apiKey -> tvdbApiKey migration
    if(!state.settings.tvdbApiKey && typeof profile.apiKey==='string') state.settings.tvdbApiKey = profile.apiKey;
  }
  state.library = animeRows.map(r=> normalizeLibraryItem(r,'anime')).filter(Boolean);
  state.showLibrary = seriesRows.map(r=> normalizeLibraryItem(r,'show')).filter(Boolean);
  state.notifications = notifRows.map(r=> ({
    id: r.id,
    title: normalizeText(r.title, MAX_LIBRARY_TITLE_LENGTH),
    animeId: typeof r.animeId==='string'? r.animeId:'',
    mediaType: r.mediaType==='show'?'show': r.mediaType==='anime'?'anime':'',
    read: !!r.read,
    titleSeen: !!r.titleSeen,
    createdAt: typeof r.createdAt==='number'? r.createdAt: Date.now(),
  })).sort((a,b)=> b.createdAt - a.createdAt);
  // fix aliases
  state.library.forEach(it=> it.tmdbMeta = it.tvdbMeta);
  state.showLibrary.forEach(it=> it.tmdbMeta = it.tvdbMeta);
}

  if('photoURL' in toSave){

      delete toSave.photoURL; // avoid wiping existing photo with undefined
    } else {
      toSave.photoURL = normalizeProfilePhoto(toSave.photoURL);
    }
  }
  Object.assign(state.settings, toSave);
  await idbPut('profile', { id:'settings', ...state.settings });

async function saveItem(item){
  const clean = normalizeLibraryItem(item, item.mediaType);
  if(!clean) throw new Error('Invalid library item');
  clean.updatedAt = Date.now();
  clean.tmdbMeta = clean.tvdbMeta;
  const store = clean.mediaType==='show'? 'series':'anime';
  await idbPut(store, denormalizeForStorage(clean));
  // update in-memory
  const lib = clean.mediaType==='show'? state.showLibrary: state.library;
  const idx = lib.findIndex(x=> x.id===clean.id);
  if(idx>=0) lib[idx]=clean; else lib.push(clean);
  return clean;
}
async function deleteItemById(id){
  // try both stores
  const aIdx = state.library.findIndex(x=>x.id===id);
  const sIdx = state.showLibrary.findIndex(x=>x.id===id);
  let mediaType = null;
  if(aIdx>=0) mediaType='anime';
  else if(sIdx>=0) mediaType='show';
  else {
    // still try delete from both
    await Promise.all([idbDelete('anime', id), idbDelete('series', id)]);
    return;
  }
  const item = mediaType==='show'? state.showLibrary[sIdx]: state.library[aIdx];
  await idbDelete(mediaType==='show'?'series':'anime', id);
  if(mediaType==='show') state.showLibrary.splice(sIdx,1);
  else state.library.splice(aIdx,1);
}

/* ---------- TVDB API ---------- */
let tvdbToken=null;
let tvdbTokenExpiresAt=0;
function hasApiKey(){ return !!(state.settings.tvdbApiKey && state.settings.tvdbApiKey.trim()); }
function hasTmdbApiKey(){ return !!(state.settings.tmdbApiKey && state.settings.tmdbApiKey.trim()); }

// Optional TMDB lookup used only for a real 0–10 rating. TVDB remains the
// source for titles, metadata, seasons, and episode counts.
async function fetchTmdbRating(tvdbId){
  if(!hasTmdbApiKey()) return null;
  const id=normalizeTvdbId(tvdbId);
  if(id==null) return null;
  const url = `https://api.themoviedb.org/3/find/${id}?external_source=tvdb_id&api_key=${encodeURIComponent(state.settings.tmdbApiKey.trim())}`;
  let res;
  try{ res=await fetch(url,{cache:'no-store'}); }catch(e){ return null; }
  if(!res.ok) return null;
  let json;
  try{ json=await res.json(); }catch(e){ return null; }
  const hit=json.tv_results?.[0];
  if(!hit) return null;
  const voteAverage=typeof hit.vote_average==='number'? hit.vote_average:Number(hit.vote_average);
  const voteCount=typeof hit.vote_count==='number'? hit.vote_count:Number(hit.vote_count);
  if(!Number.isFinite(voteAverage)||voteAverage<0||voteAverage>10||!Number.isFinite(voteCount)||voteCount<0) return null;
  return { voteAverage, voteCount: Math.floor(voteCount) };
}
async function tvdbLogin(){
  if(!hasApiKey()){ const e=new Error('No TVDB API key configured.'); e.code='NO_KEY'; throw e; }
  const body={ apikey: state.settings.tvdbApiKey.trim() };
  if(state.settings.tvdbPin && state.settings.tvdbPin.trim()) body.pin = state.settings.tvdbPin.trim();
  let res;
  try{ res = await fetch(TVDB_BASE+'/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); }
  catch(err){ const e=new Error('Network error reaching TVDB.'); e.code='NETWORK'; throw e; }
  if(!res.ok){
    let msg='TVDB login failed ('+res.status+').';
    if(res.status===401) msg='TVDB rejected the API key / PIN. Check your subscriber PIN if your key requires it.';
    const e=new Error(msg); e.code='HTTP_'+res.status; throw e;
  }
  const json=await res.json();
  const token=json.data?.token || json.token;
  if(!token) throw new Error('TVDB login did not return a token.');
  tvdbToken=token;
  tvdbTokenExpiresAt=Date.now()+20*24*60*60*1000;
}
async function tvdbFetch(path, params){
  if(!hasApiKey()){ const e=new Error('No TVDB API key configured.'); e.code='NO_KEY'; throw e; }
  if(!tvdbToken || Date.now()>=tvdbTokenExpiresAt) await tvdbLogin();
  const url=new URL(TVDB_BASE+path);
  Object.entries(params||{}).forEach(([k,v])=> url.searchParams.set(k,v));
  let res;
  try{ res=await fetch(url.toString(), { cache:'no-store', headers:{ 'Authorization':'Bearer '+tvdbToken, 'Accept':'application/json' }}); }
  catch(err){ const e=new Error('Network error reaching TVDB.'); e.code='NETWORK'; throw e; }
  if(res.status===401){
    await tvdbLogin();
    try{ res=await fetch(url.toString(), { cache:'no-store', headers:{ 'Authorization':'Bearer '+tvdbToken, 'Accept':'application/json' }}); }
    catch(err){ const e=new Error('Network error reaching TVDB.'); e.code='NETWORK'; throw e; }
  }
  if(!res.ok){
    let msg='TVDB request failed ('+res.status+').';
    if(res.status===401) msg='TVDB rejected the API key.';
    if(res.status===404) msg='Not found on TVDB.';
    const e=new Error(msg); e.code='HTTP_'+res.status; throw e;
  }
  return res.json();
}
async function searchTv(query){
  const data = await tvdbFetch('/search', { query, type:'series', limit:'12' });
  const raw = Array.isArray(data.data)? data.data: [];
  const mapped = raw.map(r=>{
    let numericId=null;
    if(r.tvdb_id) numericId=parseInt(r.tvdb_id,10);
    else if(r.id && String(r.id).startsWith('series-')) numericId=parseInt(String(r.id).split('-')[1],10);
    else if(r.id) numericId=parseInt(r.id,10);
    const name = pickEnglishTitleFromSearch(r);
    const poster = r.image_url || r.image || null;
    if(!numericId || !name) return null;
    // Capture genre hint if search already includes it — avoids extra /extended fetch
    let genresHint = null;
    if(Array.isArray(r.genres) && r.genres.length) genresHint = r.genres.map(g=> typeof g==='string'? g : g.name).filter(Boolean);
    else if(Array.isArray(r.genre) && r.genre.length) genresHint = r.genre.map(g=> typeof g==='string'? g : g.name).filter(Boolean);
    const primaryType = r.primary_type || r.type || null;
    let overview = '';
    if(r.overview && !hasJapanese(r.overview)) overview = r.overview;
    else if(r.overviewTranslations && r.overviewTranslations.eng) overview = r.overviewTranslations.eng;
    return { id: numericId, name, poster_path: poster, overview: overview||'', genresHint, primaryType };
  }).filter(Boolean);
  return { results: mapped };
}
function tvdbSeriesToAnimeShape(tv){
  const seasons = (tv.seasons||[]).map(s=> ({ seasonNumber:s.seasonNumber, name:s.name, episodeCount:s.episodeCount||0, watched:false }));
  const meta = {
    numberOfSeasons: tv.numberOfSeasons ?? seasons.length,
    numberOfEpisodes: tv.numberOfEpisodes ?? seasons.reduce((a,s)=>a+(s.episodeCount||0),0),
    tvdbStatus: tv.status||'',
    tmdbStatus: tv.status||'',
    episodeRuntime: tv.runtime||null,
    // TVDB score is not a rating; TMDB rating fields are populated separately.
    score: null,
    tmdbVoteAverage: null,
    tmdbVoteCount: null,
    tmdbRatingCheckedAt: null,
    genres: tv.genres||[],
    tvdbRefreshedAt: Date.now(),
  };
  return {
    tvdbId: tv.id,
    tmdbId: tv.id,
    title: tv.name,
    poster: tv.image || null,
    backdrop: tv.image || null,
    seasons,
    tvdbMeta: meta,
    tmdbMeta: meta,
  };
}
async function getTvDetails(tvdbId){
  const json = await tvdbFetch('/series/'+tvdbId+'/extended', {meta:'translations'});
  const tv = json.data;
  if(!tv || !tv.id) throw new Error('TVDB returned invalid data.');
  // Pick English title (avoid Japanese)
  const englishName = pickEnglishNameFromExtended(tv);
  // genres
  const genres = Array.isArray(tv.genres)? tv.genres.map(g=> typeof g==='string'? g: g.name).filter(Boolean):[];
  // seasons — use English season name, fallback to "Season N" if Japanese
  let seasonsRaw = Array.isArray(tv.seasons)
    ? tv.seasons.filter(s=> s.number!==0 && s.type && s.type.type==='official').sort((a,b)=> a.number-b.number)
    : [];
  // The extended record often carries only "Aired Order"/"Season N" here.
  // Resolve generic names through the per-season English translation endpoint,
  // in small batches to avoid a burst of TVDB requests.
  const seasonNames=[];
  for(let i=0;i<seasonsRaw.length;i+=6){
    const batch=seasonsRaw.slice(i,i+6);
    seasonNames.push(...await Promise.all(batch.map(s=> fetchEnglishSeasonName(s))));
  }
  let seasons = seasonsRaw.map((s,i)=> ({ seasonNumber:s.number, name:seasonNames[i] || seasonDisplayName(s, s.number), episodeCount:0, _rawId:s.id }));
  // Episode counts — robust pagination (query ?page= vs path /default/{page}) + dedup
  try{
    const epCounts={};
    const seenEpisodeIds=new Set();
    let page=0;
    let hasMore=true;
    while(hasMore && page<6){
      let epJson=null;
      let arr=[];
      // Try query-param pagination first (swagger 4.7.10: ?page=0)
      try{
        epJson = await tvdbFetch('/series/'+tvdbId+'/episodes/default', { page:String(page) });
        const eps = epJson.data?.episodes || epJson.data || [];
        arr = Array.isArray(eps)? eps: [];
      }catch(e){ arr=[]; epJson={links:{}}; }
      if(!arr.length && page===0){
        // Fallback: some deployments expect path segment for page 0 as well
        try{
          const alt = await tvdbFetch('/series/'+tvdbId+'/episodes/default/0', {});
          const aeps = alt.data?.episodes || alt.data || [];
          if(Array.isArray(aeps) && aeps.length){ epJson=alt; arr=aeps; }
        }catch(_){}
      }
      if(!arr.length) break;
      let newInPage=0;
      arr.forEach(ep=>{
        const eid = ep.id ?? ep.episodeId ?? null;
        let key;
        if(eid!=null) key='id:'+eid;
        else key='k:'+(ep.seasonNumber ?? ep.season ?? '')+':'+(ep.name ?? '')+':'+(ep.number ?? '');
        if(seenEpisodeIds.has(key)) return;
        seenEpisodeIds.add(key);
        newInPage++;
        const sn = ep.seasonNumber ?? ep.season ?? ep.airedSeason;
        if(typeof sn==='number'&&sn>0) epCounts[sn]=(epCounts[sn]||0)+1;
      });
      // If query returned only duplicates (API ignored ?page=), try path-segment fallback for this page
      if(newInPage===0 && arr.length>0 && page>0){
        try{
          const altJson = await tvdbFetch('/series/'+tvdbId+'/episodes/default/'+page, {});
          const aeps = altJson.data?.episodes || altJson.data || [];
          const altArr = Array.isArray(aeps)? aeps: [];
          if(altArr.length){
            let altNew=0;
            const toAdd=[];
            altArr.forEach(ep=>{
              const eid = ep.id ?? ep.episodeId ?? null;
              let key;
              if(eid!=null) key='id:'+eid;
              else key='k:'+(ep.seasonNumber ?? ep.season ?? '')+':'+(ep.name ?? '')+':'+(ep.number ?? '');
              if(seenEpisodeIds.has(key)) return;
              toAdd.push({key, ep});
              altNew++;
            });
            if(altNew>0){
              toAdd.forEach(({key, ep})=>{
                seenEpisodeIds.add(key);
                const sn = ep.seasonNumber ?? ep.season ?? ep.airedSeason;
                if(typeof sn==='number'&&sn>0) epCounts[sn]=(epCounts[sn]||0)+1;
              });
              newInPage = altNew;
              epJson = altJson;
              arr = altArr;
            }
          }
        }catch(_){}
      }
      if(newInPage===0){
        console.warn('Episode pagination duplicate page', page, '— breaking early');
        break;
      }
      const next = epJson && epJson.links ? epJson.links.next : null;
      hasMore = !!next;
      // If no explicit next but we got a full page, assume more pages exist (TVDB sometimes omits links)
      // We keep page<6 guard as hard cap, so no infinite loop
      page++;
      if(!hasMore) break;
    }
    seasons = seasons.map(s=> ({...s, episodeCount: epCounts[s.seasonNumber] || 0 }));
  }catch(e){
    console.warn('Episode count fallback', e);
  }
  // fallback if no seasons but we have counts
  if(!seasons.length){
    // try to infer from counts? keep empty
  }
  const status = tv.status?.name || tv.status || '';
  const runtime = tv.averageRuntime || tv.runtime || null;
  return tvdbSeriesToAnimeShape({ id: tv.id, name: englishName, image: tv.image, genres, seasons, numberOfSeasons: seasons.length, numberOfEpisodes: seasons.reduce((a,s)=>a+(s.episodeCount||0),0), status, runtime });
}

/* ---------- Optional TMDB rating cache ---------- */
// Cache rows: {id: tvdbId, voteAverage, voteCount, checkedAt} — memory + IndexedDB
const TMDB_RATING_CACHE_TTL = 30*24*60*60*1000;
const tmdbRatingCache = new Map();
function cachedTmdbRatingValue(row){
  if(!row || typeof row.checkedAt!=='number' || Date.now()-row.checkedAt>=TMDB_RATING_CACHE_TTL) return undefined;
  if(typeof row.voteAverage!=='number' || !Number.isFinite(row.voteAverage) || row.voteAverage<0 || row.voteAverage>10) return null;
  const voteCount=boundedInteger(row.voteCount,0,2147483647,null);
  if(voteCount==null) return null;
  return { voteAverage: row.voteAverage, voteCount };
}
async function persistTmdbRatingCacheEntry(tvdbId, rating, checkedAt=Date.now()){
  const id=normalizeTvdbId(tvdbId);
  if(id==null) return;
  const row={
    id,
    voteAverage: rating && typeof rating.voteAverage==='number' && Number.isFinite(rating.voteAverage) && rating.voteAverage>=0 && rating.voteAverage<=10 ? rating.voteAverage : null,
    voteCount: rating && typeof rating.voteCount==='number' && Number.isFinite(rating.voteCount) && rating.voteCount>=0 ? Math.floor(rating.voteCount) : null,
    checkedAt,
  };
  tmdbRatingCache.set(id,row);
  try{ await idbPut('tmdbRatingCache', row); }
  catch(e){ console.warn('Could not persist TMDB rating cache', e); }
}
async function getCachedTmdbRating(tvdbId){
  if(!hasTmdbApiKey()) return { rating:null, checkedAt:null };
  const id=normalizeTvdbId(tvdbId);
  if(id==null) return { rating:null, checkedAt:null };
  let row=tmdbRatingCache.get(id);
  let cached=cachedTmdbRatingValue(row);
  if(cached!==undefined) return { rating:cached, checkedAt:row.checkedAt };
  if(!row){
    try{
      row=await idbGet('tmdbRatingCache', id);
      if(row) tmdbRatingCache.set(id,row);
      cached=cachedTmdbRatingValue(row);
      if(cached!==undefined) return { rating:cached, checkedAt:row.checkedAt };
    }catch(e){}
  }
  const checkedAt=Date.now();
  const rating=await fetchTmdbRating(id);
  await persistTmdbRatingCacheEntry(id,rating,checkedAt);
  return { rating, checkedAt };
}
async function refreshTmdbRatingForItem(item){
  if(!item || !hasTmdbApiKey()) return null;
  const result=await getCachedTmdbRating(item.tvdbId);
  const lib=item.mediaType==='show'?state.showLibrary:state.library;
  const current=lib.find(x=>x.id===item.id) || item;
  const meta=current.tvdbMeta||{};
  const voteAverage=result.rating ? result.rating.voteAverage : null;
  const voteCount=result.rating ? result.rating.voteCount : null;
  const changed=meta.tmdbVoteAverage!==voteAverage || meta.tmdbVoteCount!==voteCount || meta.tmdbRatingCheckedAt!==result.checkedAt || meta.score!==null;
  if(changed){
    current.tvdbMeta={...meta, score:null, tmdbVoteAverage:voteAverage, tmdbVoteCount:voteCount, tmdbRatingCheckedAt:result.checkedAt};
    current.tmdbMeta=current.tvdbMeta;
    await saveItem(current);
  }
  return result.rating;
}

/* ---------- Animation filter (TVDB genres) ---------- */
// Cache: tvdbId -> boolean (true = Animation/Anime) — memory + IndexedDB
const animationCache = new Map();
async function persistAnimationCacheEntry(tvdbId, isAnim){
  try{
    await idbPut('animationCache', { id: Number(tvdbId), isAnimated: isAnim, checkedAt: Date.now() });
  }catch(e){ console.warn('Could not persist animation cache', e); }
}
async function isAnimatedForId(tvdbId){
  if(animationCache.has(tvdbId)) return animationCache.get(tvdbId);
  // Check IDB fallback (in case loaded after boot race)
  try{
    const row = await idbGet('animationCache', Number(tvdbId));
    if(row && typeof row.isAnimated==='boolean' && (Date.now() - (row.checkedAt||0) < 60*24*60*60*1000)){
      animationCache.set(tvdbId, row.isAnimated);
      return row.isAnimated;
    }
  }catch(e){}
  try{
    const json = await tvdbFetch('/series/'+tvdbId+'/extended', {meta:'translations'});
    const tv = json.data;
    const genres = Array.isArray(tv.genres) ? tv.genres.map(g=> typeof g==='string'? g : g.name).filter(Boolean) : [];
    const isAnim = genres.some(g=> /^(animation|anime)$/i.test(String(g).trim()));
    animationCache.set(tvdbId, isAnim);
    persistAnimationCacheEntry(tvdbId, isAnim);
    return isAnim;
  }catch(e){
    console.warn('Genre check failed for', tvdbId, e);
    // Don't persist failures — transient 500 would hide title from Anime tab for 60 days otherwise
    // Cache in memory for this session only to avoid tight retry loop, but allow retry next reload
    animationCache.set(tvdbId, false);
    return false;
  }
}
async function filterResultsByTab(results, tab, searchVer){
  if(!results.length) return results;
  // Use genre hint from search (if TVDB included it) to avoid extra fetches
  results.forEach(r=>{
    if(animationCache.has(r.id)) return;
    if(Array.isArray(r.genresHint) && r.genresHint.length){
      const isAnim = r.genresHint.some(g=> /^(animation|anime)$/i.test(String(g).trim()));
      animationCache.set(r.id, isAnim);
      persistAnimationCacheEntry(r.id, isAnim);
    }
  });
  // Cap to 12 to bound API calls (was 20 → 12 to match search limit and avoid silent drop of 13-20)
  const CAP = 12;
  const sliceForVerify = results.slice(0, CAP);
  const needed = sliceForVerify.filter(r=> !animationCache.has(r.id));
  // Gentle concurrency: 6 at a time (TVDB stricter than TMDB)
  for(let i=0;i<needed.length;i+=6){
    const batch = needed.slice(i,i+6);
    await Promise.all(batch.map(r=> isAnimatedForId(r.id)));
    if(typeof searchVer==='number' && searchVer!==searchRequestVersion) return []; // aborted — caller checks version
    // Progressive update: if this search is still current, show intermediate results
    if(typeof searchVer==='number' && searchVer===searchRequestVersion && i+6 < needed.length){
      const interimFiltered = results.filter(r=>{
        // Only include those we have decided so far; hide undecided yet
        if(!animationCache.has(r.id)) return false;
        const isAnim = animationCache.get(r.id);
        return tab==='anime' ? isAnim===true : isAnim===false;
      });
      // Update UI progressively (keep spinner)
      if(interimFiltered.length || i===0){
        state.searchResults = interimFiltered;
        // Don't hide spinner yet, but show partial results underneath
        const area = document.getElementById('search-results-area');
        if(area){
          // Render partial inline without clearing loading flag
          const prevLoading = state.searchLoading;
          state.searchLoading = false;
          area.innerHTML = renderSearchResultsBody();
          // restore loading state for outer logic to manage
          state.searchLoading = prevLoading;
          area.querySelectorAll('[data-preview]').forEach(el=> el.addEventListener('click',()=> openPreview(Number(el.getAttribute('data-preview')))));
          // Show a small progress hint
          const hint = document.createElement('div');
          hint.className='search-hint';
          hint.style.paddingTop='4px';
          hint.textContent = `Checking ${needed.length - (i+6) } more…`;
          area.appendChild(hint);
        }
      }
    }
  }
  return results.filter((r, idx)=>{
    if(idx >= CAP && !animationCache.has(r.id)) return false; // beyond cap, no hint → exclude to bound API calls
    const isAnim = animationCache.get(r.id);
    if(isAnim==null) return false;
    return tab==='anime' ? isAnim===true : isAnim===false;
  });
}

const EMPTY_STATUS_MESSAGES = {

  planned: 'You have nothing planned😳? What are you doing?',
  comeback: 'There are no returning shows🥱',
  returning: 'There are no returning shows🥱',

};
const SORT_OPTIONS = [
  { key:'az', label:'A–Z' },
  { key:'added', label:'Recently Added' },
  { key:'updated', label:'Recently Updated' },
  { key:'rating', label:'Rating' },
];
const RATING_SORT_ORDER = { hot:0, good:1, okay:2, bad:3 };
function compareByRating(a,b){
  const ra = RATING_SORT_ORDER.hasOwnProperty(a.rating)? RATING_SORT_ORDER[a.rating]:4;
  const rb = RATING_SORT_ORDER.hasOwnProperty(b.rating)? RATING_SORT_ORDER[b.rating]:4;
  return ra-rb || a.title.localeCompare(b.title);
}
function itemRuntimeMinutes(a){
  const m=a.tvdbMeta&&typeof a.tvdbMeta.episodeRuntime==='number'&&a.tvdbMeta.episodeRuntime>0?a.tvdbMeta.episodeRuntime:null;
  if(m) return m;
  return a.mediaType==='show'? SERIES_FALLBACK_RUNTIME_MIN: ANIME_FALLBACK_RUNTIME_MIN;
}
function watchedMinutesForItem(a){
  const per=itemRuntimeMinutes(a);
  return (a.seasons||[]).reduce((s,season)=> s+(season.watched?(season.episodeCount||0)*per:0),0);
}
function watchedMinutesForLibrary(items){ return items.reduce((s,a)=> s+watchedMinutesForItem(a),0); }
function pluralUnit(n,u){ return n+' '+u+(n===1?'':'s'); }
function formatWatchedTime(tm){ const h=Math.floor(tm/60), m=tm%60; return pluralUnit(h,'hour')+' '+pluralUnit(m,'minute'); }
function activeLibrary(){ return state.activeTab==='anime'? state.library: state.showLibrary; }
function activeStatuses(){ return state.activeTab==='anime'? STATUSES: SHOW_STATUSES; }
function activeStatusMap(){ return state.activeTab==='anime'? STATUS_MAP: SHOW_STATUS_MAP; }
function activeSortKey(){ return state.activeTab==='anime'? state.sortBy.anime: state.sortBy.shows; }
function sortItems(items){
  const mode=activeSortKey();
  const out=items.slice();
  if(mode==='added') out.sort((x,y)=> (y.addedAt||0)-(x.addedAt||0));
  else if(mode==='updated') out.sort((x,y)=> (y.updatedAt||0)-(x.updatedAt||0));
  else if(mode==='rating') out.sort(compareByRating);
  else out.sort((x,y)=> x.title.localeCompare(y.title));
  return out;
}
function hasUnseenTitleUpdate(item){
  return !!item && state.notifications.some(n=> !n.titleSeen && n.animeId===item.id && n.mediaType===item.mediaType);
}
function markTitleUpdatesSeen(item){
  const matching=state.notifications.filter(n=> !n.titleSeen && n.animeId===item.id && n.mediaType===item.mediaType);
  if(!matching.length) return;
  matching.forEach(n=>{
    n.titleSeen=true;
    saveNotification(n).catch(()=>{ n.titleSeen=false; });
  });
}
function updateBellBadge(){
  const badge=document.getElementById('bell-badge');
  const n=state.notifications.filter(x=> !x.read).length;
  if(n>0){ badge.hidden=false; badge.textContent=n>99?'99+':String(n); } else badge.hidden=true;
}
function timeAgo(ts){
  const d=Date.now()-ts;
  const m=Math.round(d/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.round(m/60);
  if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}

function goSearch({fresh=true}={}){ if(fresh) resetSearchState(); state.view='search'; render(); setTimeout(()=>{ const i=document.getElementById('search-input'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); }

let searchDebounce=null;
let searchRequestVersion=0;
async function runSearch(q){
  const ver=++searchRequestVersion;
  state.searchQuery=q;
  if(!q.trim()){ state.searchResults=[]; state.searchError=''; updateSearchResults(); return; }
  state.searchLoading=true; updateSearchResults();
  try{
    const data=await searchTv(q.trim());
    if(ver!==searchRequestVersion) return;
    let results = data.results||[];
    if(results.length){
      const filtered = await filterResultsByTab(results, state.activeTab, ver);
      if(ver!==searchRequestVersion) return;
      state.searchResults = filtered;
    } else {
      state.searchResults = [];
    }
    state.searchError='';
  }catch(err){
    if(ver!==searchRequestVersion) return;
    state.searchError=err.message||'Something went wrong.'; state.searchResults=[];
  }
  if(ver!==searchRequestVersion) return;
  state.searchLoading=false; updateSearchResults();
}
function onSearchInput(v){ clearTimeout(searchDebounce); searchDebounce=setTimeout(()=> runSearch(v),380); }

async function openPreview(tvdbId){
  const safe=normalizeTvdbId(tvdbId);
  if(!safe){ showToast('Invalid TVDB id.'); return; }
  state.view='detail'; state.previewMode=true; state.detailLoading=true; render();
  try{
    const tv=await getTvDetails(safe);
    const preview=normalizeLibraryItem(tv, state.activeTab==='anime'?'anime':'show');
    if(!preview) throw new Error('TVDB returned invalid data.');
    if(hasTmdbApiKey()){
      try{
        const result=await getCachedTmdbRating(preview.tvdbId);
        const rating=result.rating;
        preview.tvdbMeta={...preview.tvdbMeta, score:null, tmdbVoteAverage:rating?rating.voteAverage:null, tmdbVoteCount:rating?rating.voteCount:null, tmdbRatingCheckedAt:result.checkedAt};
        preview.tmdbMeta=preview.tvdbMeta;
      }catch(e){ console.warn('TMDB preview rating failed for',preview.title,e); }
    }
    state.previewTvdb=preview;
  }catch(err){ showToast(err.message||'Could not load details.'); state.view='search'; state.previewMode=false; render(); return; }
  state.detailLoading=false; render();
}

async function confirmAddWithStatus(statusKey){

  const item=normalizeLibraryItem({ tvdbId:src.tvdbId, title:src.title, poster:src.poster, backdrop:src.backdrop, status:statusKey, rating:null, seasons:src.seasons, tvdbMeta:src.tvdbMeta, addedAt:Date.now(), updatedAt:Date.now() }, state.activeTab==='anime'?'anime':'show');
