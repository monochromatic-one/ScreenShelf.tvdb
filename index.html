let searchDebounce=null;
let searchRequestVersion=0;
async function runSearch(q){
  const ver=++searchRequestVersion;
  state.searchQuery=q;
  if(!q.trim()){ state.searchResults=[]; state.searchError=''; updateSearchResults(); return; }
  state.searchLoading=true; updateSearchResults();
  try{
    const data=await searchTv(q.trim());
    if(ver!==searchRequestVersion) return;
    let results = data.results||[];
    if(results.length){
      const filtered = await filterResultsByTab(results, state.activeTab, ver);
      if(ver!==searchRequestVersion) return;
      state.searchResults = filtered;
    } else {
      state.searchResults = [];
    }
    state.searchError='';
  }catch(err){
    if(ver!==searchRequestVersion) return;
    state.searchError=err.message||'Something went wrong.'; state.searchResults=[];
  }
  if(ver!==searchRequestVersion) return;
  state.searchLoading=false; updateSearchResults();
}
function onSearchInput(v){ clearTimeout(searchDebounce); searchDebounce=setTimeout(()=> runSearch(v),380); }

async function openPreview(tvdbId){
  const safe=normalizeTvdbId(tvdbId);
  if(!safe){ showToast('Invalid TVDB id.'); return; }
  state.view='detail'; state.previewMode=true; state.detailLoading=true; render();
  let preview=null;
  try{
    const tv=await getTvDetails(safe,{fast:true});
    preview=normalizeLibraryItem(tv, state.activeTab==='anime'?'anime':'show');
    if(!preview) throw new Error('TVDB returned invalid data.');
    state.previewTvdb=preview;
  }catch(err){ showToast(err.message||'Could not load details.'); state.anilistLoadingTvdbId=null; state.view='search'; state.previewMode=false; render(); return; }
  const shouldLoadAniList=state.activeTab==='anime';
  state.anilistLoadingTvdbId=shouldLoadAniList?safe:null;
  state.detailLoading=false; render();
  // Optional AniList enrichment is deliberately started after the fast TVDB
  // Details page is visible. It can never block TVDB metadata or first paint.
  if(shouldLoadAniList){
    enrichAniListRelations(preview).then(enriched=>{
      if(enriched && state.view==='detail' && state.previewMode && state.previewTvdb && String(state.previewTvdb.tvdbId)===String(safe)){
        const aniMeta=preview.tvdbMeta||enriched.tvdbMeta||{};
        const currentMeta=state.previewTvdb.tvdbMeta||{};
        state.previewTvdb.tvdbMeta={...currentMeta,anilistId:aniMeta.anilistId||currentMeta.anilistId,anilistMatchedTitle:aniMeta.anilistMatchedTitle||'',anilistMatchYear:aniMeta.anilistMatchYear||null,anilistRelatedSeries:aniMeta.anilistRelatedSeries||[],anilistCheckedAt:aniMeta.anilistCheckedAt||null};
        state.previewTvdb.tmdbMeta=state.previewTvdb.tvdbMeta;
      }
    }).finally(()=>{
      if(String(state.anilistLoadingTvdbId)===String(safe)){
        state.anilistLoadingTvdbId=null;
        if(state.view==='detail' && state.previewMode && state.previewTvdb && String(state.previewTvdb.tvdbId)===String(safe)) render();
      }
    });
  }
  // Enrich after the first paint: season translations, episode counts, and
  // related-series cards should not block the usable Details page.
  getTvDetails(safe).then(full=>{
    const enriched=normalizeLibraryItem(full, state.activeTab==='anime'?'anime':'show');
    if(!enriched) return;
    if(state.view==='detail' && state.previewMode && state.previewTvdb && String(state.previewTvdb.tvdbId)===String(safe)){
      const oldMeta=state.previewTvdb.tvdbMeta||{};
      enriched.tvdbMeta={...enriched.tvdbMeta,anilistId:oldMeta.anilistId||enriched.tvdbMeta.anilistId,anilistMatchedTitle:oldMeta.anilistMatchedTitle||'',anilistMatchYear:oldMeta.anilistMatchYear||null,anilistRelatedSeries:oldMeta.anilistRelatedSeries||[],anilistCheckedAt:oldMeta.anilistCheckedAt||null};
      enriched.tmdbMeta=enriched.tvdbMeta;
      state.previewTvdb=enriched;
      render();
    }
  }).catch(e=> console.warn('TVDB detail enrichment failed for',safe,e));
}

  const item=activeLibrary().find(v=> v.id===localId);

function fileToCompressedDataUrl(file,size=160,quality=0.7){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const side=Math.min(img.width,img.height); const sx=(img.width-side)/2, sy=(img.height-side)/2;
        const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,sx,sy,side,side,0,0,size,size);
        resolve(canvas.toDataURL('image/jpeg',quality));
      }catch(err){ reject(err); } finally{ URL.revokeObjectURL(url); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Could not read image.')); };
    img.src=url;
  });
}
async function onAvatarFileSelected(file){

  state.avatarUploading=true; state.avatarError=''; render();
  try{
    const dataUrl=await fileToCompressedDataUrl(file);
    if(dataUrl.length>MAX_PROFILE_PHOTO_LENGTH) throw new Error('Too large');
    await saveProfile({photoURL:dataUrl}); showToast('Picture updated.');
  }catch(e){ state.avatarError='Could not use that picture.'; showToast('Could not update picture.'); }
  finally{ state.avatarUploading=false; render(); }
}

/* ---------- Import / Export ---------- */
function exportLibrary(){
  const ser=a=>({ tvdbId:a.tvdbId, tmdbId:a.tvdbId, title:a.title, poster:a.poster||null, backdrop:a.backdrop||null, status:a.status, rating:a.rating||null, addedAt:a.addedAt||null, mediaType:a.mediaType||null, seasons:(a.seasons||[]).map(s=>({seasonNumber:s.seasonNumber,name:s.name,episodeCount:s.episodeCount,watched:!!s.watched})), tvdbMeta:a.tvdbMeta||a.tmdbMeta||null, tmdbMeta:a.tvdbMeta||a.tmdbMeta||null });
  const payload={ app:'screenshelf-tvdb', version:2, exportedAt:new Date().toISOString(), libraries:{ anime: state.library.map(ser), series: state.showLibrary.map(ser) }};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const link=document.createElement('a'); link.href=url; link.download='screenshelf-tvdb-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); showToast('Backup downloaded.');
}
async function importLibrary(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ showToast('Not valid JSON.'); return; }
  // Guard against TMDB ID namespace mix — TVDB IDs differ
  const isLegacyTmdb = data && typeof data==='object' && (
    (typeof data.app==='string' && (data.app==='screenshelf' || (/tmdb/i.test(data.app) && !/tvdb/i.test(data.app)))) ||
    (data.version!=null && data.version < 2 && !data.app) ||
    (typeof data.app==='string' && data.app!=='screenshelf-tvdb' && !/tvdb/i.test(data.app) && data.version===2)
  );
  if(isLegacyTmdb){
    showToast('Old TMDB backup detected — TMDB IDs don’t match TVDB, those entries will be skipped.');
  }
  const animeIncoming= Array.isArray(data?.libraries?.anime)?data.libraries.anime : Array.isArray(data?.library)?data.library : Array.isArray(data)?data:[];
  const seriesIncoming= Array.isArray(data?.libraries?.series)?data.libraries.series:[];
  if(!animeIncoming.length&&!seriesIncoming.length){ showToast("Doesn't look like a ScreenShelf backup."); return; }
  let aAdded=0,sAdded=0,skipped=0;
  const restore=async(item,mediaType)=>{
    const restored=normalizeLibraryItem(item,mediaType); if(!restored){ skipped++; return; }
    restored.tmdbMeta=restored.tvdbMeta;
    const target=mediaType==='show'? state.showLibrary: state.library;
    if(target.some(x=> String(x.tvdbId)===String(restored.tvdbId))){ skipped++; return; }
    try{ await saveItem(restored); if(mediaType==='show') sAdded++; else aAdded++; }catch(e){ skipped++; }
  };
  for(const it of animeIncoming) await restore(it,'anime');
  for(const it of seriesIncoming) await restore(it,'show');
  showToast(`Imported ${aAdded} anime + ${sAdded} series${skipped?`, skipped ${skipped}`:''}.`);
  render();
}
async function clearAllData(){
  if(!confirm('Clear all data? This deletes your library, settings and notifications from this browser. Export first if you want a backup.')) return;
  const db=await getDB();
  const stores=['anime','series','notifications','profile','animationCache','tvdbCache'];
  await Promise.all(stores.map(s=> new Promise((res,rej)=>{ 
    try{
      const tx=db.transaction(s,'readwrite'); tx.objectStore(s).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
    }catch(e){ res(); } // store may not exist on old DB
  })));
  state.library=[]; state.showLibrary=[]; state.notifications=[];
  animationCache.clear();
  anilistMappingCache.clear();
  anilistRelationsCache.clear();
  tvdbExtendedCache.clear();
  tvdbBaseCache.clear();
  tvdbListCache.clear();
  state.settings={ tvdbApiKey:'', tvdbPin:'', theme:'dark', accent:ACCENTS[0], displayName:'', photoURL:'', showLibraryRatings:false };
  tvdbToken=null; applyTheme(); showToast('Data cleared.'); render();
}

/* ---------- Per-title TVDB refresh ---------- */
async function refreshCurrentTitle(){
  const current=activeLibrary().find(x=>x.id===state.detailId);
  if(!current || state.previewMode || state.refreshingTitleId) return;
  if(!hasApiKey()){ showToast('Add a TVDB API key to refresh this title.'); return; }
  state.refreshingTitleId=current.id;
  render();
  try{
    const tv=await getTvDetails(current.tvdbId,{fresh:true});
    const prev=current.tvdbMeta||{};
    const freshMeta=tv.tvdbMeta||{};
    const hasFreshSeasons=Array.isArray(tv.seasons)&&tv.seasons.length>0;
    const ns=hasFreshSeasons?freshMeta.numberOfSeasons:(prev.numberOfSeasons||0);
    const ne=hasFreshSeasons?freshMeta.numberOfEpisodes:(prev.numberOfEpisodes||0);
    const st=freshMeta.tvdbStatus||'';
    const newContent=ns>(prev.numberOfSeasons||0)||ne>(prev.numberOfEpisodes||0);
    const returned=prev.tvdbStatus&&/ended|canceled|cancelled/i.test(prev.tvdbStatus)&&st&&/returning|continuing/i.test(st);
    const freshTitle=tv.title||current.title;
    const watchedBySeason=new Map((current.seasons||[]).map(s=>[s.seasonNumber,!!s.watched]));
    const freshSeasons=hasFreshSeasons
      ? tv.seasons.map(s=>({...s,watched:watchedBySeason.get(s.seasonNumber)||false}))
      : (current.seasons||[]);
    const existingMeta=current.tvdbMeta||{};
    current.title=freshTitle;
    current.poster=tv.poster||null;
    current.backdrop=tv.backdrop||null;
    current.seasons=freshSeasons;
    current.tvdbMeta={...existingMeta,
      numberOfSeasons:ns,
      numberOfEpisodes:ne,
      tvdbStatus:st,
      tmdbStatus:st,
      episodeRuntime:freshMeta.episodeRuntime,
      overview:freshMeta.overview,
      genres:freshMeta.genres,
      relatedSeries:freshMeta.relatedSeries,
      detailsPending:false,
      tvdbRefreshedAt:Date.now(),
    };
    current.tmdbMeta=current.tvdbMeta;
    await saveItem(current);
    if(newContent||returned){
      const note={id:uid(),animeId:current.id,mediaType:current.mediaType||'anime',title: returned? freshTitle+' is returning!' : freshTitle+' — '+((ns-(prev.numberOfSeasons||0))>0? `New season (${ns} total)` : `${ne-(prev.numberOfEpisodes||0)} new episode${(ne-(prev.numberOfEpisodes||0))===1?'':'s'}`),createdAt:Date.now(),read:false,titleSeen:false};
      state.notifications.unshift(note);
      await saveNotification(note);
    }
    showToast('Title updated from TVDB.');
  }catch(e){
    console.warn('Title refresh failed for',current.title,e);
    showToast(e.message||'Could not refresh this title.');
  }finally{
    state.refreshingTitleId=null;
    render();
  }
}

/* ---------- Wiring ---------- */
function wireViewEvents(){
  const main=document.getElementById('main');
  main.querySelectorAll('[data-media-tab]').forEach(el=> el.addEventListener('click',()=>{
    state.activeTab=el.getAttribute('data-media-tab'); state.expandedStatus=null; state.view='home'; state.previewMode=false; state.anilistLoadingTvdbId=null; state.searchQuery=''; state.searchResults=[]; render();
  }));
  const sortSelect=document.getElementById('sort-select');
  if(sortSelect) sortSelect.addEventListener('change',()=>{ const k=state.activeTab==='anime'?'anime':'shows'; state.sortBy[k]=sortSelect.value; render(); });
  main.querySelector('[data-toggle-library-ratings]')?.addEventListener('click', toggleLibraryRatings);
  main.querySelectorAll('[data-set-library-view]').forEach(el=> el.addEventListener('click',()=> setLibraryView(el.getAttribute('data-set-library-view'))));
  main.querySelectorAll('[data-go]').forEach(el=> el.addEventListener('click',()=>{ const to=el.getAttribute('data-go'); if(to==='home') goHome(); else if(to==='search') goSearch({fresh:false}); else if(to==='settings') goSettings(); }));
  document.getElementById('empty-search-btn')?.addEventListener('click',()=> goSearch());
  main.querySelectorAll('[data-toggle-status]').forEach(el=> el.addEventListener('click',()=>{ const k=el.getAttribute('data-toggle-status'); state.expandedStatus= state.expandedStatus===k?null:k; render(); }));
  main.querySelectorAll('[data-open-detail]').forEach(el=> el.addEventListener('click',()=> openDetail(el.getAttribute('data-open-detail'))));
  const searchInput=document.getElementById('search-input');
  if(searchInput) searchInput.addEventListener('input', e=> onSearchInput(e.target.value));
  main.querySelectorAll('[data-preview]').forEach(el=> el.addEventListener('click',()=> openPreview(Number(el.getAttribute('data-preview')))));
  main.querySelectorAll('[data-related-preview]').forEach(el=> el.addEventListener('click',()=> openPreview(Number(el.getAttribute('data-related-preview')))));
  main.querySelectorAll('[data-toggle-watched]').forEach(el=> el.addEventListener('click',()=> toggleSeasonWatched(Number(el.getAttribute('data-toggle-watched')))));
  const descriptionToggle=main.querySelector('[data-description-toggle]');
  if(descriptionToggle) descriptionToggle.addEventListener('click',()=>{
    const description=document.getElementById('detail-description');
    if(!description) return;
    const expanded=description.classList.toggle('expanded');
    descriptionToggle.textContent=expanded?'Less':'More';
    descriptionToggle.setAttribute('aria-expanded',String(expanded));
  });
  main.querySelector('[data-add-anime]')?.addEventListener('click', addPreviewToLibrary);
  main.querySelector('[data-change-status]')?.addEventListener('click', openStatusSheet);
  main.querySelector('[data-open-rating]')?.addEventListener('click', openRatingSheet);
  main.querySelector('[data-delete-anime]')?.addEventListener('click', openDeleteSheet);
  main.querySelector('[data-refresh-title]')?.addEventListener('click', refreshCurrentTitle);
  document.getElementById('edit-name-btn')?.addEventListener('click', openNameEdit);
  document.getElementById('save-name-btn')?.addEventListener('click', saveNameEdit);
  document.getElementById('cancel-name-btn')?.addEventListener('click', cancelNameEdit);
  document.getElementById('profile-name-input')?.addEventListener('keydown',e=>{ if(e.key==='Enter') saveNameEdit(); if(e.key==='Escape') cancelNameEdit(); });
  const changePicBtn=document.getElementById('change-picture-btn');
  const avatarInput=document.getElementById('avatar-file-input');
  if(changePicBtn&&avatarInput){ changePicBtn.addEventListener('click',()=> avatarInput.click()); avatarInput.addEventListener('change',()=>{ if(avatarInput.files[0]) onAvatarFileSelected(avatarInput.files[0]); avatarInput.value=''; }); }
  document.getElementById('save-tvdb-key-btn')?.addEventListener('click', saveTvdbKey);
  document.getElementById('test-conn-btn')?.addEventListener('click', runTestConnection);
  main.querySelectorAll('[data-theme-choice]').forEach(el=> el.addEventListener('click',()=> setTheme(el.getAttribute('data-theme-choice'))));
  main.querySelectorAll('[data-accent]').forEach(el=> el.addEventListener('click',()=> setAccent(el.getAttribute('data-accent'))));
  document.getElementById('export-btn')?.addEventListener('click', exportLibrary);
  const importBtn=document.getElementById('import-btn'), importFile=document.getElementById('import-file');
  if(importBtn&&importFile){ importBtn.addEventListener('click',()=> importFile.click()); importFile.addEventListener('change',()=>{ if(importFile.files[0]) importLibrary(importFile.files[0]); importFile.value=''; }); }
  document.getElementById('clear-data-btn')?.addEventListener('click', clearAllData);
}
document.getElementById('sheet').addEventListener('click', e=>{
  const setStatus=e.target.closest('[data-set-status]');
  if(setStatus) return setAnimeStatus(setStatus.getAttribute('data-set-status'));
  const setRating=e.target.closest('[data-set-rating]');
  if(setRating) return setAnimeRating(setRating.getAttribute('data-set-rating'));
  const addWith=e.target.closest('[data-add-with-status]');
  if(addWith) return confirmAddWithStatus(addWith.getAttribute('data-add-with-status'));
  const delNotif=e.target.closest('[data-delete-notification]');
  if(delNotif) return deleteNotificationById(delNotif.getAttribute('data-delete-notification'));
  if(e.target.id==='cancel-delete') return closeSheet();
  if(e.target.id==='confirm-delete') return deleteCurrentAnime();
});
document.getElementById('btn-search').addEventListener('click',()=> goSearch());
document.getElementById('btn-settings').addEventListener('click',()=> goSettings());
document.getElementById('btn-bell').addEventListener('click',()=> openNotifications());

/* ---------- Boot ---------- */
(async function boot(){
  try{ await loadFromDB(); }catch(e){ console.error('DB load failed',e); }
  applyTheme(); render();
  // Correct legacy library titles in the background without delaying first paint.
  refreshNonEnglishLibraryTitles().catch(error=>console.warn('Background English-title refresh failed',error));
})();
</script>
<script>
// Register service worker for offline + installability
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      console.log('[SW] registered', reg.scope);
      reg.addEventListener('updatefound', ()=>{
        const w = reg.installing;
        if(!w) return;
        w.addEventListener('statechange', ()=>{
          if(w.state==='installed' && navigator.serviceWorker.controller){
            const t=document.getElementById('toast');
            if(t){ t.textContent='Update available — restart to apply.'; t.classList.add('show'); setTimeout(()=> t.classList.remove('show'), 4000); }
            console.log('[SW] update available');
          }
        });
      });
    }).catch(err=> console.warn('[SW] registration failed', err));
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(refreshing) return;
      refreshing=true;
      window.location.reload();
    });
  });
}
</script>
