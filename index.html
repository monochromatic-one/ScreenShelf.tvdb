<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝕾𝖈𝖗𝖊𝖊𝖓𝕾𝖍𝖊𝖑𝖋 🍥</title>
<meta name="theme-color" content="#121319">
<meta name="description" content="Track shows & anime — stays in your browser. TVDB + IndexedDB, no cloud.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScreenShelf">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="ScreenShelf 🍥">
<meta property="og:description" content="Track shows & anime — stays in your browser.">
<meta property="og:type" content="website">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#121319; --surface:#1a1c24; --surface-2:#21232d; --surface-3:#282b37;
    --text:#edeef3; --muted:#90939f; --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14);
    --accent:#e3a23b; --accent-text:#1a1206; --danger:#e0616b; --shadow: 0 12px 32px rgba(0,0,0,.35);
    --scrim: rgba(8,9,12,.6);
  }
  :root[data-theme="light"]{
    --bg:#f5f3ee; --surface:#ffffff; --surface-2:#efece4; --surface-3:#e6e2d8;
    --text:#1c1c1a; --muted:#6d6a62; --border:rgba(20,18,10,.09); --border-strong:rgba(20,18,10,.16);
    --accent:#c47f1f; --accent-text:#fffaf0; --danger:#b6414c; --shadow: 0 12px 28px rgba(30,25,10,.12);
    --scrim: rgba(30,26,16,.4);
  }
  .status-watching{ --status-color:#e3a23b; }
  .status-planned{ --status-color:#5fa3a0; }
  .status-comeback{ --status-color:#9b8ce0; }
  .status-finished{ --status-color:#6fa679; }
  .status-dropped{ --status-color:#c97b84; }
  .status-returning{--status-color:#9b8ce0;}
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  img{ display:block; max-width:100%; }
  ::selection{ background:var(--accent); color:var(--accent-text); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  .app-shell{ min-height:100%; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px; background:linear-gradient(var(--bg) 65%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ font-size:20px; }
  .brand-name{ font-size:25.5px; font-weight:800; letter-spacing:.01em; }
  .brand-screen{ color:var(--text); }
  .brand-shelf{ color:var(--accent); }
  .topbar-actions{ display:flex; gap:6px; }
  .icon-btn{
    position:relative; width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); font-size:17px; display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ transform: scale(.94); }
  .badge{
    position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
    background:var(--accent); color:var(--accent-text); font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .main{ flex:1; padding: 4px 16px 96px; max-width:720px; width:100%; margin:0 auto; }
  @media (min-width: 860px){ .main{ max-width: 820px; padding-left:0; padding-right:0; } }
  .hero-glow{
    height:1px; margin: 2px 0 18px; background:
      radial-gradient(60% 100% at 20% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    height:64px; margin-top:-64px; pointer-events:none; position:relative; z-index:-1;
  }
  .status-section{ border-top:1px solid var(--border); }
  .status-section:last-child{ border-bottom:1px solid var(--border); }
  .status-header{
    width:100%; display:flex; align-items:center; gap:10px; background:none; border:none;
    padding:15px 4px; text-align:left; font-size:15.5px; font-weight:700; color:var(--text);
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--status-color); flex:none; }
  .status-emoji{ font-size:16px; }
  .status-count{ margin-left:auto; color:var(--muted); font-weight:600; font-size:13.5px; }
  .status-caret{ color:var(--muted); font-size:12px; transition:transform .18s ease; margin-left:2px; }
  .status-header[aria-expanded="true"] .status-caret{ transform:rotate(90deg); }
  .status-list{ display:grid; grid-template-rows:0fr; overflow:hidden; transition:grid-template-rows .25s ease; }
  .status-list.open{ grid-template-rows:1fr; }
  .status-list-inner{ min-height:0; overflow:hidden; padding-bottom:10px; }
  .status-empty{ color:var(--muted); font-size:13.5px; padding:14px 4px 20px; text-align:center; line-height:1.5; }
  .main.main-flex-fill{ display:flex; flex-direction:column; }
  .watched-time-stat{ text-align:center; padding:26px 12px 10px; margin-top:auto; }
  .watched-time-main{ font-size:12.5px; }
  .watched-time-label{ font-weight:700; color:var(--muted); }
  .watched-time-value{ font-weight:400; color:var(--muted); }
  .watched-time-sub{ font-size:11px; color:var(--muted); opacity:.75; margin-top:3px; }
  .anime-row{
    width:100%; display:flex; align-items:center; gap:12px; background:none; border:none; border-top:1px solid var(--border);
    padding:9px 4px; text-align:left;
  }
  .status-list-inner .anime-row:first-child{ border-top:none; }
  .anime-row:hover{ background:var(--surface); border-radius:10px; }
  .poster-thumb{
    width:40px; height:56px; border-radius:6px; object-fit:cover; background:var(--surface-2); flex:none;
    border:1px solid var(--border);
  }
  .anime-title{ font-size:14.5px; font-weight:600; line-height:1.3; }
  .own-library-row .anime-title-wrap{ min-width:0; flex:1; }
  .own-library-row{ position:relative; }
  .own-library-row .anime-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .library-rating{ width:15px; flex:none; color:var(--muted); font-size:15px; line-height:1; text-align:center; }
  .title-update-dot{
    position:absolute; z-index:2; width:9px; height:9px; border:1.5px solid var(--surface); border-radius:50%;
    background:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .own-library-row .title-update-dot{ top:8px; right:5px; }
  .library-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; padding:0 4px; }
  .library-grid-tile{
    position:relative; display:block; min-width:0; padding:0; overflow:hidden; text-align:left;
    background:transparent; border:0; border-radius:8px; color:var(--text);
  }
  .library-grid-tile:active{ transform:scale(.98); }
  .library-grid-poster{
    width:100%; aspect-ratio:2/3; border:1px solid var(--border); border-radius:8px;
    background:var(--surface-2); object-fit:cover;
  }
  .library-grid-title{
    display:block; overflow:hidden; margin-top:6px; color:var(--text); font-size:12px; font-weight:600;
    line-height:1.3; text-overflow:ellipsis; white-space:nowrap;
  }
  .library-grid-rating{
    position:absolute; top:5px; right:5px; display:flex; align-items:center; justify-content:center;
    min-width:24px; min-height:24px; padding:2px; border:1px solid var(--border-strong); border-radius:999px;
    background:color-mix(in srgb, var(--surface) 90%, transparent); box-shadow:0 2px 6px rgba(0,0,0,.2);
    font-size:14px; line-height:1;
  }
  .library-grid-tile .title-update-dot{ top:6px; right:6px; }
  .library-grid-tile.has-title-update .library-grid-rating{ right:22px; }
  .empty-block{ padding:56px 10px; text-align:center; }
  .empty-emoji{ font-size:34px; margin-bottom:10px; }
  .empty-title{ font-weight:700; font-size:16px; margin-bottom:6px; }
  .empty-text{ color:var(--muted); font-size:14px; max-width:320px; margin:0 auto 18px; line-height:1.5; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; border:1px solid transparent;
    padding:11px 18px; font-weight:700; font-size:14px; transition: filter .15s ease, transform .1s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-accent{ background:var(--accent); color:var(--accent-text); }
  .btn-accent:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:color-mix(in srgb, var(--danger) 12%, transparent); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
  .view-head{ display:flex; align-items:center; gap:10px; padding:10px 4px 6px; }
  .back-btn{
    background:var(--accent); border:1px solid var(--accent); color:var(--accent-text);
    font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px;
    padding:8px 11px; border-radius:10px;
  }
  .back-btn:hover{ filter:brightness(1.08); }
  .view-title{ font-size:16px; font-weight:800; }
  .settings-view-head .view-title{ margin-left:auto; }
  .search-box{ display:flex; gap:8px; padding:6px 4px 16px; position:sticky; top:66px; background:var(--bg); z-index:5; }
  .search-input{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px;
    font-size:14.5px; color:var(--text);
  }
  .search-input:focus{ border-color:var(--accent); }
  .search-hint{ color:var(--muted); font-size:13.5px; padding:8px 6px 20px; line-height:1.5; }
  .search-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:14px; padding:4px; }
  .search-card{ background:none; border:none; text-align:left; padding:0; }
  .search-poster{ width:100%; aspect-ratio:2/3; border-radius:10px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); margin-bottom:7px; }
  .search-card-title{ font-size:13px; font-weight:600; line-height:1.3; }
  .search-card-owned{ font-size:11px; color:var(--accent); font-weight:700; margin-top:2px; }
  .search-primary-label{ color:var(--muted); font-size:12px; font-weight:800; padding:4px 4px 8px; }
  .search-primary-note{ color:var(--muted); font-size:12px; line-height:1.4; padding:8px 4px 0; }
  .detail-hero{ text-align:center; padding:6px 4px 18px; }
  .detail-title{ font-size:19px; font-weight:800; margin:0 0 16px; line-height:1.3; }
  .detail-poster-wrap{ position:relative; max-width:230px; margin:0 auto; }
  .detail-poster{ width:100%; aspect-ratio:2/3; border-radius:16px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); box-shadow:var(--shadow); }
  .detail-stats{
    display:inline-flex; gap:8px; align-items:center; margin-top:14px; background:var(--surface); border:1px solid var(--border);
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--muted);
  }
  .detail-stats b{ color:var(--text); }
  .detail-genres{ display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin:10px auto 0; max-width:480px; }
  .detail-genre{ padding:4px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--muted); font-size:11px; font-weight:700; line-height:1.2; }
  .detail-description-wrap{ max-width:560px; margin:12px auto 0; text-align:left; }
  .detail-description{ color:var(--muted); font-size:13px; line-height:1.45; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden; }
  .detail-description.expanded{ display:block; }
  .detail-description-toggle{ margin-top:4px; padding:0; border:0; background:none; color:var(--accent); font-size:12px; font-weight:800; }
  .detail-description-toggle:hover{ text-decoration:underline; }
  .tvdb-status-signature{ position:absolute; left:calc(100% + 10px); top:50%; z-index:1; width:155px; max-width:155px; color:var(--accent); font-family:"Segoe Print","Bradley Hand",cursive; font-size:16.5px; font-style:italic; font-weight:800; letter-spacing:.015em; line-height:1.15; text-align:left; white-space:normal; transform:translateY(-50%) rotate(-12deg); transform-origin:left center; pointer-events:none; text-shadow:0 1px 0 color-mix(in srgb, var(--bg) 75%, transparent); }
  @media (max-width:420px){
    .tvdb-status-signature{ left:calc(100% + 8px); width:115px; max-width:115px; font-size:15px; }
  }
  .detail-actions{ padding:8px 4px 22px; display:flex; flex-direction:column; gap:10px; }
  .status-pill{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; padding:7px 13px 7px 10px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border); align-self:center; color:var(--text); cursor:pointer;
  }
  .status-pill:hover{ background:var(--surface-2); }
  .status-pill .status-dot{ width:7px; height:7px; }
  .detail-meta-row{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .rating-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:7px 13px 7px 10px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--muted);
  }
  .rating-pill:hover{ background:var(--surface-2); }
  .rating-pill .rating-emoji{ font-size:15px; color:var(--text); }
  .section-label{ font-size:12.5px; font-weight:700; color:var(--muted); padding:18px 4px 8px; }
  .season-row{ border-top:1px solid var(--border); }
  .season-head{ width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; padding:13px 4px; text-align:left; }
  .season-name{ font-size:14.5px; font-weight:600; flex:1; }
  .season-check{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border-strong); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--surface);
  }
  .season-check.checked{ background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
  .tvdb-title-link{
    display:inline-flex; align-items:center; justify-content:center; margin-top:10px; padding:6px 10px;
    border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--accent);
    font-size:11.5px; font-weight:800; text-decoration:none;
  }
  .tvdb-title-link:hover{ background:var(--surface-2); }
  .tvdb-detail-tools{ display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .tvdb-detail-tools .tvdb-title-link{ margin-top:0; }
  .tvdb-refresh-btn{ display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--muted); font-size:11.5px; font-weight:800; }
  .tvdb-refresh-btn:hover{ background:var(--surface-2); color:var(--text); }
  .tvdb-refresh-btn:disabled{ cursor:wait; opacity:.65; }
  .tvdb-refresh-time{ padding:24px 4px 8px; color:var(--muted); text-align:center; font-size:11.5px; line-height:1.4; }
  .related-series{ margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
  .related-series-title{ font-size:14px; font-weight:800; margin:0 4px 3px; }
  .related-series-subtitle{ color:var(--muted); font-size:11.5px; margin:0 4px 12px; }
  .related-series-group{ margin-top:12px; }
  .related-series-list-name{ color:var(--muted); font-size:11.5px; font-weight:800; margin:0 4px 7px; }
  .related-series-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:12px; }
  .related-series-card{ min-width:0; padding:0; border:0; background:none; color:var(--text); text-align:left; }
  .related-series-card:hover .related-series-poster{ border-color:var(--accent); transform:translateY(-2px); }
  .related-series-poster{ width:100%; aspect-ratio:2/3; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); object-fit:cover; transition:transform .15s ease,border-color .15s ease; }
  .related-series-name{ display:block; margin-top:6px; font-size:12px; font-weight:700; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .related-series-meta{ display:block; margin-top:2px; color:var(--muted); font-size:10.5px; line-height:1.25; }
  .related-series-loading{ display:flex; align-items:center; gap:8px; margin:10px 4px 2px; padding:10px 11px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--muted); font-size:12px; font-weight:600; }
  .related-series-loading .spinner{ font-size:17px; line-height:1; }
  .profile-row{ display:flex; align-items:center; gap:16px; }
  .avatar-wrap{
    position:relative; width:64px; height:64px; border-radius:50%; flex:none;
    background:var(--surface-2); border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .avatar-img{ width:100%; height:100%; object-fit:cover; display:none; }
  .avatar-img.has-photo{ display:block; }
  .avatar-fallback{ font-size:26px; }
  .avatar-wrap.uploading::after{ content:''; position:absolute; inset:0; background:var(--scrim); }
  .avatar-spinner{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:16px; }
  .avatar-wrap.uploading .avatar-spinner{ display:flex; }
  .profile-info{ flex:1; min-width:0; }
  .profile-name-row{ display:flex; align-items:center; gap:8px; }
  .profile-name{ font-size:15.5px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .name-edit-btn{ background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:700; padding:2px 4px; flex:none; }
  .profile-name-edit-row{ display:flex; gap:6px; align-items:center; }
  .profile-name-input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:7px 10px; font-size:14px; min-width:0; }
  .profile-name-input:focus{ border-color:var(--accent); }
  .profile-name-save{ background:var(--accent); color:var(--accent-text); border:none; border-radius:9px; padding:7px 10px; font-size:12.5px; font-weight:700; flex:none; }
  .profile-name-cancel{ background:none; border:none; color:var(--muted); font-size:12.5px; padding:7px 6px; flex:none; }
  .profile-email{ font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .change-pic-btn{ margin-top:10px; }
  .avatar-error{ font-size:12px; color:var(--danger); margin-top:8px; }
  .field{ margin-bottom:18px; }
  .field-label{ font-size:13px; font-weight:700; margin-bottom:7px; display:block; }
  .field-help{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .field-input{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 13px; font-size:14px; }
  .field-input:focus{ border-color:var(--accent); }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .test-status{ font-size:12.5px; margin-top:9px; font-weight:600; }
  .test-status.ok{ color:#6fa679; }
  .test-status.err{ color:var(--danger); }
  .theme-row{ display:flex; gap:10px; }
  .theme-opt{ flex:1; padding:12px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); text-align:center; font-size:13px; font-weight:700; }
  .theme-opt.active{ border-color:var(--accent); color:var(--accent); }
  .swatches{ display:flex; gap:9px; flex-wrap:wrap; margin-top:2px; }
  .swatch{ width:30px; height:30px; border-radius:9px; border:2px solid transparent; }
  .swatch.active{ border-color:var(--text); }
  .divider{ height:1px; background:var(--border); margin:22px 0; }
  .import-export-row{ display:flex; gap:10px; }
  .import-export-row .btn{ flex:1; }
  .overlay{
    position:fixed; inset:0; background:var(--scrim); z-index:50; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){ .overlay{ align-items:center; } }

<script type="module">
/* =========================================================
   ScreenShelf — TVDB + IndexedDB Local Edition
   No Firebase. No accounts. Everything stays in this browser.
========================================================= */
'use strict';

/* ---------- Constants ---------- */
const STATUSES = [
  { key:'watching', label:'Watching',      emoji:'⛩️' },

const SHOW_STATUSES = [
  { key:'watching', label:'Watching', emoji:'🍿' },

  { key:'returning', label:'Returning', emoji:'🔄' },
  { key:'finished', label:'Finished', emoji:'✅' },
  { key:'dropped', label:'Dropped', emoji:'🗑️' },

const SHOW_STATUS_MAP = Object.fromEntries(SHOW_STATUSES.map(s=>[s.key,s]));
const RATINGS = [
  { key:'hot',  label:'PEAK',      emoji:'♨️' },
  { key:'good', label:'Go for it', emoji:'😌' },
  { key:'okay', label:'Timepass',  emoji:'🫠' },

const RATING_UNSET_EMOJI = '❓';
const ANIME_FALLBACK_RUNTIME_MIN = 24;
const SERIES_FALLBACK_RUNTIME_MIN = 50;
const TVDB_BASE = 'https://api4.thetvdb.com/v4';
const ANILIST_GRAPHQL = 'https://graphql.anilist.co';
const ANILIST_MAPPING_CACHE_TTL = 30*24*60*60*1000;
const ANILIST_RELATIONS_CACHE_TTL = 14*24*60*60*1000;
const ANILIST_UNMATCHED_CACHE_TTL = 24*60*60*1000;
const ANILIST_REQUEST_TIMEOUT = 9000;
const anilistMappingCache = new Map();
const anilistRelationsCache = new Map();
const ACCENTS = ['#e3a23b','#9b8ce0','#5fa3a0','#c97b84','#6fa679','#7f9fe0'];
const PLACEHOLDER_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="100%" height="100%" fill="#272a35"/><text x="50%" y="52%" font-size="46" text-anchor="middle" fill="#565a6b" font-family="sans-serif">🎬</text></svg>'
);

/* ---------- App state ---------- */
const state = {
  library: [],
  showLibrary: [],
  activeTab: 'shows',
  settings: { tvdbApiKey:'', tvdbPin:'', theme:'dark', accent: ACCENTS[0], displayName:'', photoURL:'', showLibraryRatings:false },
  editingProfileName: false,
  avatarUploading: false,
  avatarError: '',
  notifications: [],
  homeScrollY: null,
  expandedStatus: null,
  view: 'home',
  detailId: null,
  searchQuery: '',
  searchResults: [],
  searchLoading: false,
  searchError: '',
  detailLoading: false,
  previewMode: false,
  previewTvdb: null,
  refreshingTitleId: null,
  anilistLoadingTvdbId: null,
  sortBy: { anime: 'az', shows: 'az' },
  libraryView: 'list',
};

function uid(){
  return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   IndexedDB — single source of truth (replaces Firestore)
========================================================= */
const DB_NAME = 'screenshelf-tvdb-local';
const DB_VERSION = 6;
let dbPromise = null;
function getDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      const oldVersion = e.oldVersion;
      if(!db.objectStoreNames.contains('profile')) db.createObjectStore('profile',{keyPath:'id'});
      if(!db.objectStoreNames.contains('anime')) db.createObjectStore('anime',{keyPath:'id'});
      if(!db.objectStoreNames.contains('series')) db.createObjectStore('series',{keyPath:'id'});
      if(!db.objectStoreNames.contains('notifications')) db.createObjectStore('notifications',{keyPath:'id'});
      if(!db.objectStoreNames.contains('animationCache')) db.createObjectStore('animationCache',{keyPath:'id'});
      if(!db.objectStoreNames.contains('tvdbCache')) db.createObjectStore('tvdbCache',{keyPath:'id'});
      if(oldVersion<4 && db.objectStoreNames.contains('companionMovies')) db.deleteObjectStore('companionMovies');
      if(oldVersion<5 && db.objectStoreNames.contains('tmdbRatingCache')) db.deleteObjectStore('tmdbRatingCache');
      // v1 -> v2/v3/v4/v5/v6 migrations happen automatically (new stores are created and retired stores are removed)
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
    req.onblocked = ()=> console.warn('IndexedDB blocked');
  });
  return dbPromise;
}
async function idbGetAll(store){
  const db = await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).getAll();
    req.onsuccess=()=>res(req.result||[]);
    req.onerror=()=>rej(req.error);
  });
}
async function idbGet(store,key){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).get(key);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function idbPut(store,value){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}
async function idbDelete(store,key){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}

/* ---------- Helpers: Japanese detection & English picking ---------- */
const CJK_RE = /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9faf\uac00-\ud7af]/;
const LETTER_RE = /\p{L}/u;
const LATIN_SCRIPT_RE = /\p{Script=Latin}/u;
function hasJapanese(text){ return typeof text==='string' && CJK_RE.test(text); }
function hasNonLatinLetters(text){
  for(const char of String(text||'')){
    if(LETTER_RE.test(char) && !LATIN_SCRIPT_RE.test(char)) return true;
  }
  return false;
}
function isEnglishText(value){
  const text=typeof value==='string'?value.trim():'';
  return !!text && !hasNonLatinLetters(text) && /[A-Za-z0-9]/.test(text);
}
function pickEnglishTitleFromSearch(r){
  // TVDB search may return Hindi, Tamil, Japanese or another local title in r.name;
  // prefer an English translation and only fall back to an ASCII slug.
  if(r.translations){
    if(isEnglishText(r.translations.eng)) return r.translations.eng.trim();
    if(isEnglishText(r.translations.en)) return r.translations.en.trim();
    // translations could be object with many langs — match only en / eng (not "fr-en" or "french")
    for(const [lang,val] of Object.entries(r.translations)){
      if(isEnglishText(val) && /^en(g)?$/i.test(String(lang).trim())) return val.trim();
    }
  }
  if(isEnglishText(r.name)) return r.name.trim();
  if(isEnglishText(r.extendedTitle)) return r.extendedTitle.trim();
  if(typeof r.slug==='string' && r.slug.trim()){
    // Title-case slug but keep small words lowercase (e.g. "Attack on Titan" not "Attack On Titan")
    const stop = new Set(['a','an','and','as','at','but','by','for','in','nor','of','on','or','the','to','with','vs','vs.','via']);
    const words = r.slug.replace(/-/g,' ').split(/\s+/).filter(Boolean);
    const slugTitle=words.map((w,i)=> {
      const lw = w.toLowerCase();
      if(i!==0 && stop.has(lw)) return lw;
      return lw.charAt(0).toUpperCase()+lw.slice(1);
    }).join(' ');
    if(isEnglishText(slugTitle)) return slugTitle;
  }
  const fallback=(r.name || r.extendedTitle || '').trim();
  return isEnglishText(fallback)?fallback:'';
}
function pickEnglishNameFromExtended(tv){
  if(isEnglishText(tv.name)) return tv.name.trim();
  // Try nameTranslations
  if(tv.translations && Array.isArray(tv.translations.nameTranslations)){
    const en = tv.translations.nameTranslations.find(t=> t.language==='eng' && isEnglishText(t.name));
    if(en) return en.name.trim();
  }
  if(Array.isArray(tv.aliases)){
    const enAlias = tv.aliases.find(a=> {
      const n = a.name || a.alias;
      return isEnglishText(n) && (a.language==='eng' || a.language==='en' || !a.language);
    });
    if(enAlias) return (enAlias.name || enAlias.alias).trim();
  }
  if(typeof tv.slug==='string' && tv.slug.trim()){
    const stop = new Set(['a','an','and','as','at','but','by','for','in','nor','of','on','or','the','to','with','vs','vs.','via']);
    const words = tv.slug.replace(/-/g,' ').split(/\s+/).filter(Boolean);
    const slugTitle=words.map((w,i)=> {
      const lw = w.toLowerCase();
      if(i!==0 && stop.has(lw)) return lw;
      return lw.charAt(0).toUpperCase()+lw.slice(1);
    }).join(' ');
    if(isEnglishText(slugTitle)) return slugTitle;
  }
  const fallback=(tv.name || '').trim();
  return isEnglishText(fallback)?fallback:'';
}
function pickEnglishOverviewFromExtended(tv){
  const direct=typeof tv.overview==='string'?tv.overview.trim():'';
  if(isEnglishText(direct)) return direct;
  const readTranslation=(value)=>{
    if(typeof value==='string') return isEnglishText(value)?value.trim():'';
    if(Array.isArray(value)){
      for(const row of value){
        if(!row||typeof row!=='object') continue;
        const lang=String(row.language||row.lang||'').trim();
        if(!/^en(g)?$/i.test(lang)) continue;
        const text=row.overview||row.description||row.value||row.name;
        if(isEnglishText(text)) return text.trim();
      }
      return '';
    }
    if(value&&typeof value==='object'){
      for(const key of ['eng','en']){
        const text=value[key];
        if(isEnglishText(text)) return text.trim();
      }
    }
    return '';
  };
  const translated=readTranslation(tv.overviewTranslations)||readTranslation(tv.translations?.overviewTranslations)||readTranslation(tv.translations?.overview);
  return translated||'';
}
function seasonDisplayName(s, fallbackNumber){
  if(isEnglishText(s.name)) return s.name.trim();
  return 'Season '+fallbackNumber;
}
const seasonNameCache = new Map();
const GENERIC_SEASON_NAME_RE = /^(?:season\s*\d+|aired\s+order|dvd\s+order|absolute\s+order|alternate(?:\s+dvd)?\s+order|regional\s+order|default\s+order)$/i;
function seasonNeedsTranslation(s, fallbackNumber){
  const name=seasonDisplayName(s,fallbackNumber);
  return !name || GENERIC_SEASON_NAME_RE.test(name.trim());
}
async function fetchEnglishSeasonName(s){
  const displayed=seasonDisplayName(s,s.number);
  const fallback=GENERIC_SEASON_NAME_RE.test(displayed.trim()) ? 'Season '+s.number : displayed;
  const seasonId=normalizeTvdbId(s&&s.id);
  if(!seasonNeedsTranslation(s,s.number) || seasonId==null) return fallback;
  if(seasonNameCache.has(seasonId)) return seasonNameCache.get(seasonId);
  let name=fallback;
  try{
    const json=await tvdbFetch('/seasons/'+seasonId+'/translations/eng',{});
    const candidate=json.data?.name;
    if(isEnglishText(candidate) && !GENERIC_SEASON_NAME_RE.test(candidate.trim())) name=candidate.trim();
  }catch(e){ console.warn('Season name lookup failed for',seasonId,e); }
  seasonNameCache.set(seasonId,name);
  return name;
}

/* ---------- Normalizers (local) ---------- */
const MAX_PROFILE_PHOTO_LENGTH = 300000;
const MAX_LIBRARY_TITLE_LENGTH = 240;
const MAX_SEASON_NAME_LENGTH = 160;
const MAX_OVERVIEW_LENGTH = 6000;

function normalizeText(value, maxLength){ return typeof value==='string'? value.trim().slice(0,maxLength):''; }
function boundedInteger(value,min,max,fallback){
  const n = typeof value==='number'?value:(typeof value==='string'&&/^\d+$/.test(value)?Number(value):NaN);
  return Number.isSafeInteger(n)&&n>=min&&n<=max? n: fallback;
}
function normalizeTvdbId(value){ return boundedInteger(value,1,2147483647,null); }
function normalizeProfilePhoto(value){
  if(typeof value!=='string') return '';
  return value==='' || (value.length<=MAX_PROFILE_PHOTO_LENGTH && /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(value)) ? value : '';
}
function normalizeSeason(v){
  if(!v||typeof v!=='object'||Array.isArray(v)) return null;
  const seasonNumber=boundedInteger(v.seasonNumber,1,1000,null);
  const episodeCount=boundedInteger(v.episodeCount,0,10000,null);
  if(seasonNumber==null||episodeCount==null) return null;
  return { seasonNumber, name: normalizeText(v.name,MAX_SEASON_NAME_LENGTH) || ('Season '+seasonNumber), episodeCount, watched: !!v.watched };
}
function normalizeTvdbGenres(value){
  if(!Array.isArray(value)) return [];
  const seen=new Set();
  return value.slice(0,20).map(g=>{
    const raw = typeof g==='string'? g : g && g.name;
    return normalizeText(raw,60);
  }).filter(n=>{ if(!n||seen.has(n)) return false; seen.add(n); return true; });
}
function normalizeRelatedSeries(value){
  if(!Array.isArray(value)) return [];
  const seen=new Set();
  return value.slice(0,6).map(group=>{
    if(!group||typeof group!=='object') return null;
    const listId=normalizeTvdbId(group.id);
    const listName=normalizeText(group.name,120) || 'TVDB franchise';
    const items=Array.isArray(group.items)? group.items.slice(0,20).map(item=>{
      if(!item||typeof item!=='object') return null;
      const id=normalizeTvdbId(item.id ?? item.tvdbId);
      const title=normalizeText(item.title||item.name,MAX_LIBRARY_TITLE_LENGTH);
      if(id==null||!title||seen.has(id)) return null;
      seen.add(id);
      return {
        id,
        title,
        poster: typeof item.poster==='string'?item.poster.trim()||null:null,
        year: normalizeText(item.year,20),
        status: normalizeText(item.status,80),
      };
    }).filter(Boolean):[];

    if(!group||typeof group!=='object') return null;
    const groupId=normalizeText(group.id,80) || 'anilist-relations';
    const groupName=normalizeText(group.name,120) || 'AniList relations';
    const items=Array.isArray(group.items)? group.items.slice(0,20).map(item=>{

      const id=normalizeTvdbId(item.id ?? item.tvdbId);

      if(id==null||!title||seen.has(id)) return null;
      seen.add(id);
      return {
        id,
        title,
        poster: typeof item.poster==='string'?item.poster.trim()||null:null,
        year: normalizeText(item.year,20),

function normalizeLibraryItem(value, mediaType){

    tmdbId: tvdbId, // alias for legacy code paths
    title,
    poster: typeof value.poster==='string'? value.poster.trim()||null : null,
    backdrop: typeof value.backdrop==='string'? value.backdrop.trim()||null : null,

function denormalizeForStorage(item){

/* ---------- Local persistence helpers ---------- */
async function loadFromDB(){
  const [profile, animeRows, seriesRows, notifRows, animCacheRows] = await Promise.all([
    idbGet('profile','settings'),
    idbGetAll('anime'),
    idbGetAll('series'),
    idbGetAll('notifications'),
    idbGetAll('animationCache').catch(()=>[]),
  ]);
  // Restore persisted animation genres cache (speeds up search filtering)
  try{
    if(Array.isArray(animCacheRows)){
      animCacheRows.forEach(row=>{
        if(row && typeof row.id!=='undefined' && typeof row.isAnimated==='boolean'){
          // Only restore recent entries (< 60 days) to keep data fresh
          const age = Date.now() - (row.checkedAt||0);
          if(age < 60*24*60*60*1000) animationCache.set(Number(row.id), row.isAnimated);
        }
      });
    }
  }catch(e){ console.warn('Could not restore animation cache', e); }
  if(profile){
    if(typeof profile.tvdbApiKey==='string') state.settings.tvdbApiKey = profile.tvdbApiKey;
    if(typeof profile.tvdbPin==='string') state.settings.tvdbPin = profile.tvdbPin;
    if(typeof profile.theme==='string') state.settings.theme = profile.theme;
    if(typeof profile.accent==='string') state.settings.accent = profile.accent;
    if(typeof profile.displayName==='string') state.settings.displayName = profile.displayName;
    if(typeof profile.photoURL==='string') state.settings.photoURL = normalizeProfilePhoto(profile.photoURL);
    if(typeof profile.showLibraryRatings==='boolean') state.settings.showLibraryRatings = profile.showLibraryRatings;
    // legacy apiKey -> tvdbApiKey migration
    if(!state.settings.tvdbApiKey && typeof profile.apiKey==='string') state.settings.tvdbApiKey = profile.apiKey;
  }
  state.library = animeRows.map(r=> normalizeLibraryItem(r,'anime')).filter(Boolean);
  state.showLibrary = seriesRows.map(r=> normalizeLibraryItem(r,'show')).filter(Boolean);
  state.notifications = notifRows.map(r=> ({
    id: r.id,
    title: normalizeText(r.title, MAX_LIBRARY_TITLE_LENGTH),
    animeId: typeof r.animeId==='string'? r.animeId:'',
    mediaType: r.mediaType==='show'?'show': r.mediaType==='anime'?'anime':'',
    read: !!r.read,
    titleSeen: !!r.titleSeen,
    createdAt: typeof r.createdAt==='number'? r.createdAt: Date.now(),
  })).sort((a,b)=> b.createdAt - a.createdAt);
  // fix aliases
  state.library.forEach(it=> it.tmdbMeta = it.tvdbMeta);
  state.showLibrary.forEach(it=> it.tmdbMeta = it.tvdbMeta);
}
async function saveProfile(fields){
  const toSave = { ...fields };
  if('photoURL' in toSave){
    if(typeof toSave.photoURL === 'undefined'){
      delete toSave.photoURL; // avoid wiping existing photo with undefined
    } else {
      toSave.photoURL = normalizeProfilePhoto(toSave.photoURL);
    }
  }
  Object.assign(state.settings, toSave);
  await idbPut('profile', { id:'settings', ...state.settings });
  applyTheme();
}
async function saveItem(item){
  const clean = normalizeLibraryItem(item, item.mediaType);
  if(!clean) throw new Error('Invalid library item');
  clean.updatedAt = Date.now();
  clean.tmdbMeta = clean.tvdbMeta;
  const store = clean.mediaType==='show'? 'series':'anime';
  await idbPut(store, denormalizeForStorage(clean));
  // update in-memory
  const lib = clean.mediaType==='show'? state.showLibrary: state.library;
  const idx = lib.findIndex(x=> x.id===clean.id);
  if(idx>=0) lib[idx]=clean; else lib.push(clean);
  return clean;
}
async function deleteItemById(id){
  // try both stores
  const aIdx = state.library.findIndex(x=>x.id===id);
  const sIdx = state.showLibrary.findIndex(x=>x.id===id);
  let mediaType = null;
  if(aIdx>=0) mediaType='anime';
  else if(sIdx>=0) mediaType='show';
  else {
    // still try delete from both
    await Promise.all([idbDelete('anime', id), idbDelete('series', id)]);
    return;
  }
  const item = mediaType==='show'? state.showLibrary[sIdx]: state.library[aIdx];
  await idbDelete(mediaType==='show'?'series':'anime', id);
  if(mediaType==='show') state.showLibrary.splice(sIdx,1);
  else state.library.splice(aIdx,1);
}
async function saveNotification(n){

}
async function deleteNotification(id){
  await idbDelete('notifications', id);
  state.notifications = state.notifications.filter(x=> x.id!==id);
}

let tvdbToken=null;

const TVDB_BASE_CACHE_TTL=30*60*1000;

const tvdbExtendedCache=new Map();
const tvdbBaseCache=new Map();
const tvdbListCache=new Map();
function hasApiKey(){ return !!(state.settings.tvdbApiKey && state.settings.tvdbApiKey.trim()); }
async function readTvdbCache(key,ttl){
  try{
    const row=await idbGet('tvdbCache',key);
    if(row&&row.data&&typeof row.checkedAt==='number'&&Date.now()-row.checkedAt<ttl) return row.data;
  }catch(e){}

}
async function fetchTvdbSeriesExtended(tvdbId,{fresh=false}={}){
  const id=normalizeTvdbId(tvdbId);
  if(id==null) throw new Error('Invalid TVDB id.');
  const cached=tvdbExtendedCache.get(id);
  if(!fresh&&cached&&Date.now()-cached.checkedAt<TVDB_EXTENDED_CACHE_TTL) return cached.data;
  if(!fresh){
    const stored=await readTvdbCache('series-extended-'+id,TVDB_EXTENDED_CACHE_TTL);
    if(stored){ tvdbExtendedCache.set(id,{data:stored,checkedAt:Date.now()}); return stored; }
  }

  const data=json.data;

  writeTvdbCache('series-extended-'+id,data);

async function tvdbLogin(){
  if(!hasApiKey()){ const e=new Error('No TVDB API key configured.'); e.code='NO_KEY'; throw e; }
  const body={ apikey: state.settings.tvdbApiKey.trim() };
  if(state.settings.tvdbPin && state.settings.tvdbPin.trim()) body.pin = state.settings.tvdbPin.trim();
  let res;
  try{ res = await fetch(TVDB_BASE+'/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); }
  catch(err){ const e=new Error('Network error reaching TVDB.'); e.code='NETWORK'; throw e; }
  if(!res.ok){
    let msg='TVDB login failed ('+res.status+').';
    if(res.status===401) msg='TVDB rejected the API key / PIN. Check your subscriber PIN if your key requires it.';
    const e=new Error(msg); e.code='HTTP_'+res.status; throw e;
  }
  const json=await res.json();
  const token=json.data?.token || json.token;
  if(!token) throw new Error('TVDB login did not return a token.');
  tvdbToken=token;
  tvdbTokenExpiresAt=Date.now()+20*24*60*60*1000;
}
async function tvdbFetch(path, params){
  if(!hasApiKey()){ const e=new Error('No TVDB API key configured.'); e.code='NO_KEY'; throw e; }
  if(!tvdbToken || Date.now()>=tvdbTokenExpiresAt) await tvdbLogin();
  const url=new URL(TVDB_BASE+path);
  Object.entries(params||{}).forEach(([k,v])=> url.searchParams.set(k,v));
  let res;
  try{ res=await fetch(url.toString(), { cache:'no-store', headers:{ 'Authorization':'Bearer '+tvdbToken, 'Accept':'application/json' }}); }
  catch(err){ const e=new Error('Network error reaching TVDB.'); e.code='NETWORK'; throw e; }
  if(res.status===401){
    await tvdbLogin();
    try{ res=await fetch(url.toString(), { cache:'no-store', headers:{ 'Authorization':'Bearer '+tvdbToken, 'Accept':'application/json' }}); }
    catch(err){ const e=new Error('Network error reaching TVDB.'); e.code='NETWORK'; throw e; }
  }
  if(!res.ok){
    let msg='TVDB request failed ('+res.status+').';
    if(res.status===401) msg='TVDB rejected the API key.';
    if(res.status===404) msg='Not found on TVDB.';
    const e=new Error(msg); e.code='HTTP_'+res.status; throw e;
  }
  return res.json();
}
/* ---------- Optional AniList anime relations ---------- */
const ANILIST_RESOLVE_QUERY = `query ($search: String!, $perPage: Int) {
  Page(perPage: $perPage) {
    media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
      id
      title { romaji english native }
      startDate { year }
    }
  }
}`;
const ANILIST_MEDIA_QUERY = `query ($id: Int!) {
  Media(id: $id, type: ANIME) {
    id
    title { romaji english native }
    startDate { year }
    relations {
      edges {
        relationType
        node {
          id
          type
          format
          title { romaji english native }
          coverImage { extraLarge large medium }
          startDate { year }
        }
      }
    }
  }
}`;
function anilistTitleValues(media){
  const title=media&&media.title||{};
  return [title.english,title.romaji,title.native].filter(v=>typeof v==='string'&&v.trim());
}
function anilistPreferredTitle(media){ return anilistTitleValues(media)[0]||''; }
function anilistRelationLabel(type){
  const raw=String(type||'').trim().toLowerCase().replace(/_/g,' ');
  return raw.replace(/\b\w/g,c=>c.toUpperCase());
}
function extractAniListRemoteId(tv){
  const remoteIds=Array.isArray(tv?.remoteIds)?tv.remoteIds:[];
  for(const row of remoteIds){
    if(!row||typeof row!=='object') continue;
    const label=[row.sourceName,row.source,row.type,row.name].filter(Boolean).join(' ');
    if(!/anilist/i.test(label)) continue;
    const id=normalizeAniListId(row.id ?? row.value ?? row.remoteId ?? row.remote_id);
    if(id!=null) return id;
  }
  return null;
}
function readYear(value){
  const match=String(value??'').match(/\b(19\d{2}|20\d{2}|21\d{2})\b/);
  return match?Number(match[1]):null;
}
function anilistTitleSimilarity(left,right){
  const a=normalizedSearchText(left).replace(/\s*\((?:19|20)\d{2}\)\s*$/,'').trim();
  const b=normalizedSearchText(right).replace(/\s*\((?:19|20)\d{2}\)\s*$/,'').trim();
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.startsWith(b)||b.startsWith(a)) return Math.min(a.length,b.length)/Math.max(a.length,b.length)*.12+.78;
  if(a.includes(b)||b.includes(a)) return Math.min(a.length,b.length)/Math.max(a.length,b.length)*.1+.7;
  const aa=new Set(a.split(/\s+/).filter(Boolean));
  const bb=new Set(b.split(/\s+/).filter(Boolean));
  const overlap=[...aa].filter(token=>bb.has(token)).length;
  return overlap?overlap/Math.max(aa.size,bb.size):0;
}
function chooseAniListCandidate(candidates,title,year){
  const target=normalizedSearchText(title);
  if(!target||!Array.isArray(candidates)||!candidates.length) return null;
  const scored=candidates.map((candidate,index)=>{
    const similarities=anilistTitleValues(candidate).map(value=>anilistTitleSimilarity(target,value));
    const similarity=Math.max(0,...similarities);
    const candidateYear=readYear(candidate.startDate?.year);
    const yearDelta=year!=null&&candidateYear!=null?Math.abs(year-candidateYear):null;
    let score=similarity*1000;
    if(yearDelta===0) score+=80;
    else if(yearDelta===1) score+=20;
    else if(yearDelta!=null&&yearDelta>3) score-=80;
    return {candidate,index,similarity,candidateYear,yearDelta,score};
  }).sort((a,b)=>b.score-a.score||a.index-b.index);
  const top=scored[0];
  const exact=scored.filter(x=>x.similarity>=.995);
  if(exact.length>1){
    const yearExact=year!=null?exact.filter(x=>x.candidateYear===year):[];
    if(yearExact.length===1) return yearExact[0].candidate;
    if(!yearExact.length && new Set(exact.map(x=>x.candidateYear).filter(Boolean)).size>1) return null;
  }
  if(top.similarity<.82) return null;
  const second=scored[1];
  if(second && top.similarity<.995 && top.similarity-second.similarity<.08 && (top.yearDelta==null||second.yearDelta==null||top.yearDelta!==0)) return null;
  if(year!=null&&top.candidateYear!=null&&top.yearDelta>3&&top.similarity<.995) return null;
  return top.candidate;
}
async function anilistGraphql(query,variables){
  const controller=typeof AbortController==='function'?new AbortController():null;
  const timer=controller?setTimeout(()=>controller.abort(),ANILIST_REQUEST_TIMEOUT):null;
  try{
    const options={method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables})};
    if(controller) options.signal=controller.signal;
    const response=await fetch(ANILIST_GRAPHQL,options);
    if(!response.ok){
      const error=new Error('AniList request failed ('+response.status+').');
      error.code='ANILIST_HTTP_'+response.status;
      throw error;
    }
    const payload=await response.json();
    if(payload?.errors?.length){
      const error=new Error(payload.errors[0]?.message||'AniList returned an error.');
      error.code='ANILIST_GRAPHQL';
      throw error;
    }
    return payload?.data||null;
  }catch(error){
    if(error?.name==='AbortError'){
      const timeoutError=new Error('AniList request timed out.');
      timeoutError.code='ANILIST_TIMEOUT';
      throw timeoutError;
    }
    throw error;
  }finally{
    if(timer) clearTimeout(timer);
  }
}
async function resolveAniListMediaForItem(item){
  const tvdbId=normalizeTvdbId(item?.tvdbId||item?.id);
  if(tvdbId==null||!item?.title) return null;
  if(anilistMappingCache.has(tvdbId)) return anilistMappingCache.get(tvdbId);
  const missingKey='anilist-missing-'+tvdbId;
  const missing=await readTvdbCache(missingKey,ANILIST_UNMATCHED_CACHE_TTL);
  if(missing) return null;
  const cacheKey='anilist-map-'+tvdbId;
  const cached=await readTvdbCache(cacheKey,ANILIST_MAPPING_CACHE_TTL);
  if(cached&&normalizeAniListId(cached.id)!=null){
    anilistMappingCache.set(tvdbId,cached);
    return cached;
  }
  const year=item.tvdbMeta?.firstAiredYear ?? null;
  let media=null;
  let matchedBy='title';
  const remoteId=normalizeAniListId(item.tvdbMeta?.anilistId);
  if(remoteId!=null){
    try{
      const direct=await anilistGraphql(ANILIST_MEDIA_QUERY,{id:remoteId});
      if(direct?.Media?.id) { media=direct.Media; matchedBy='TVDB remote ID'; }
    }catch(error){ console.warn('AniList remote-ID lookup failed for',tvdbId,error); }
  }
  if(!media){
    const data=await anilistGraphql(ANILIST_RESOLVE_QUERY,{search:item.title,perPage:8});
    const candidates=Array.isArray(data?.Page?.media)?data.Page.media:[];
    media=chooseAniListCandidate(candidates,item.title,year);
  }
  if(!media||normalizeAniListId(media.id)==null){
    writeTvdbCache(missingKey,{status:'unmatched'});
    return null;
  }
  const resolved={
    id:normalizeAniListId(media.id),
    title:anilistPreferredTitle(media)||item.title,
    year:readYear(media.startDate?.year),
    matchedBy,
  };
  anilistMappingCache.set(tvdbId,resolved);
  writeTvdbCache(cacheKey,resolved);
  return resolved;
}
async function fetchAniListRelations(anilistId){
  const id=normalizeAniListId(anilistId);
  if(id==null) return null;
  if(anilistRelationsCache.has(id)) return anilistRelationsCache.get(id);
  // v4 keeps the useful branch graph and records the relation source when a
  // connected branch is reached through another series.
  const cacheKey='anilist-relations-v4-'+id;
  const cached=await readTvdbCache(cacheKey,ANILIST_RELATIONS_CACHE_TTL);
  if(cached&&Array.isArray(cached.items)){
    anilistRelationsCache.set(id,cached);
    return cached;
  }
  const data=await anilistGraphql(ANILIST_MEDIA_QUERY,{id});
  const media=data?.Media;
  if(!media) return null;
  const allowed=new Set(['PREQUEL','SEQUEL','SIDE_STORY','SPIN_OFF','PARENT','ALTERNATIVE']);
  const relationPriority={SEQUEL:0,PREQUEL:1,PARENT:2,SPIN_OFF:3,ALTERNATIVE:4,SIDE_STORY:5};
  const seen=new Set();
  const items=(Array.isArray(media.relations?.edges)?media.relations.edges:[]).map((edge,index)=>{
    const node=edge?.node;
    const relationType=String(edge?.relationType||'').toUpperCase();
    if(!node||String(node.type).toUpperCase()!=='ANIME'||!allowed.has(relationType)) return null;
    const relatedId=normalizeAniListId(node.id);
    const title=anilistPreferredTitle(node)||anilistTitleValues(node)[0]||'';
    if(relatedId==null||!title||seen.has(relatedId)) return null;
    seen.add(relatedId);
    return {
      anilistId:relatedId,
      relationType,
      relationLabel:anilistRelationLabel(relationType),
      title,
      titles:anilistTitleValues(node),
      poster:node.coverImage?.extraLarge||node.coverImage?.large||node.coverImage?.medium||null,
      year:readYear(node.startDate?.year),
      _relationOrder:relationPriority[relationType]??99,
      _sourceOrder:index,
    };
  }).filter(Boolean).sort((a,b)=>a._relationOrder-b._relationOrder||a._sourceOrder-b._sourceOrder).slice(0,12)
    .map(({_relationOrder,_sourceOrder,...item})=>item);
  const result={ id, title:anilistPreferredTitle(media), year:readYear(media.startDate?.year), items };
  anilistRelationsCache.set(id,result);
  writeTvdbCache(cacheKey,result);
  return result;
}
async function collectAniListUniverseRelations(rootId){
  const root=await fetchAniListRelations(rootId);
  if(!root) return null;
  const rootAniListId=normalizeAniListId(rootId);
  const merged=[];
  const seen=new Set();
  const append=(item,{depth=0,viaTitle='',path=root.title||''}={})=>{
    // A second-level graph walk can point back to the title currently open.
    // Never render that root title as its own related card.
    if(!item||item.anilistId===rootAniListId||seen.has(item.anilistId)) return;
    seen.add(item.anilistId);
    merged.push({...item,relationDepth:depth,relatedVia:viaTitle,relationPath:path});
  };
  (root.items||[]).forEach(item=>append(item));
  // AniList often links a long-running universe through an immediate sequel
  // rather than repeating every later sequel on the original title. Follow one
  // branch hop so Naruto can include Boruto through Shippuden. Keep side
  // stories visible, but do not recursively walk every side story and special.
  const expandable=new Set(['SEQUEL','PREQUEL','PARENT','SPIN_OFF','ALTERNATIVE']);
  const nextNodes=(root.items||[]).filter(item=>expandable.has(item.relationType)).slice(0,4);
  for(let i=0;i<nextNodes.length;i+=2){
    const batch=nextNodes.slice(i,i+2);
    const nested=await Promise.all(batch.map(item=>fetchAniListRelations(item.anilistId).catch(error=>{ console.warn('AniList relation expansion failed',item.anilistId,error); return null; })));
    nested.forEach((group,index)=>{
      if(!group) return;
      const parent=batch[index];
      (group.items||[]).forEach(item=>append(item,{depth:1,viaTitle:parent.title,path:(root.title||'')+' → '+parent.title}));
    });
  }
  return {...root,items:merged.slice(0,20)};
}
function chooseTvdbCandidateForAniList(results,node,sourceTvdbId){
  const titles=Array.isArray(node?.titles)?node.titles:[];
  const year=node?.year??null;
  const scored=(Array.isArray(results)?results:[]).map((result,index)=>{
    if(normalizeTvdbId(result.id)===normalizeTvdbId(sourceTvdbId)) return null;
    const names=[result.name,...(Array.isArray(result.aliases)?result.aliases:[])].filter(Boolean);
    const similarity=Math.max(0,...titles.flatMap(t=>names.map(n=>anilistTitleSimilarity(t,n))));
    const yearDelta=year!=null&&result.year!=null?Math.abs(year-result.year):null;
    let score=similarity*1000;
    if(yearDelta===0) score+=80;
    else if(yearDelta===1) score+=20;
    else if(yearDelta!=null&&yearDelta>3) score-=80;
    return {result,index,similarity,yearDelta,score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score||a.index-b.index);
  const top=scored[0];
  if(!top||top.similarity<.82) return null;
  const second=scored[1];
  if(second&&top.similarity<.995&&top.similarity-second.similarity<.08&&(top.yearDelta==null||second.yearDelta==null||top.yearDelta!==0)) return null;
  if(year!=null&&top.yearDelta!=null&&top.yearDelta>3&&top.similarity<.995) return null;
  return top.result;
}
async function mapAniListNodeToTvdb(node,sourceTvdbId){
  const anilistId=normalizeAniListId(node?.anilistId);
  if(anilistId==null) return null;
  const sourceId=normalizeTvdbId(sourceTvdbId);
  const cacheKey='anilist-related-tvdb-'+anilistId;
  const missingKey='anilist-related-missing-'+anilistId;
  const cached=await readTvdbCache(cacheKey,ANILIST_MAPPING_CACHE_TTL);
  if(cached&&normalizeTvdbId(cached.id)!=null){
    // The TVDB mapping is title-specific, but relation direction is
    // source-specific. Reapply the current edge's label instead of reusing
    // the label from whichever title populated the cache first.
    if(normalizeTvdbId(cached.id)===sourceId) return null;
    return {...cached,relationType:node.relationType,relationLabel:node.relationLabel,relationDepth:boundedInteger(node.relationDepth,0,4,0),relatedVia:normalizeText(node.relatedVia,MAX_LIBRARY_TITLE_LENGTH),relationPath:normalizeText(node.relationPath,MAX_LIBRARY_TITLE_LENGTH*2),anilistId};
  }
  const missing=await readTvdbCache(missingKey,ANILIST_UNMATCHED_CACHE_TTL);
  if(missing) return null;
  let results=[];
  const resultIds=new Set();
  const searchTerms=Array.isArray(node.titles)&&node.titles.length?node.titles.slice(0,2):[node.title];
  for(const term of searchTerms){
    if(!term) continue;
    try{
      const data=await searchTv(term);
      for(const result of (data.results||[])){
        if(!resultIds.has(result.id)){ resultIds.add(result.id); results.push(result); }
      }
      // Stop early when the preferred title already produced an exact TVDB match;
      // otherwise try the alternate AniList title before declaring it unmatched.
      if(results.some(result=>Array.isArray(node.titles)&&node.titles.some(title=>anilistTitleSimilarity(title,result.name)>=.995))) break;
    }catch(error){
      console.warn('TVDB lookup for AniList relation failed',anilistId,error);
      return null;
    }
  }
  const match=chooseTvdbCandidateForAniList(results,node,sourceTvdbId);
  if(!match){ writeTvdbCache(missingKey,{status:'unmatched'}); return null; }
  if(Array.isArray(match.genresHint)&&match.genresHint.length){
    const listedAnimated=match.genresHint.some(g=>/^(animation|anime)$/i.test(String(g).trim()));
    if(!listedAnimated){ writeTvdbCache(missingKey,{status:'unmatched'}); return null; }
  }else if(!(await isAnimatedForId(match.id))){
    writeTvdbCache(missingKey,{status:'unmatched'});
    return null;
  }
  const resolved={
    id:normalizeTvdbId(match.id),
    title:match.name,
    poster:match.poster_path||node.poster||null,
    year:match.year!=null?String(match.year):(node.year!=null?String(node.year):''),
    status:'',
    anilistId,
  };
  writeTvdbCache(cacheKey,resolved);
  return {...resolved,relationType:node.relationType,relationLabel:node.relationLabel,relationDepth:boundedInteger(node.relationDepth,0,4,0),relatedVia:normalizeText(node.relatedVia,MAX_LIBRARY_TITLE_LENGTH),relationPath:normalizeText(node.relationPath,MAX_LIBRARY_TITLE_LENGTH*2)};
}
async function enrichAniListRelations(item){
  if(!item||item.mediaType!=='anime') return null;
  try{
    const resolved=await resolveAniListMediaForItem(item);
    if(!resolved) return null;
    const relationData=await collectAniListUniverseRelations(resolved.id);
    if(!relationData) return null;
    const nodes=Array.isArray(relationData.items)?relationData.items:[];
    const mapped=[];
    const mappedTvdbIds=new Set();
    for(let i=0;i<nodes.length;i+=4){
      const batch=nodes.slice(i,i+4);
      const rows=await Promise.all(batch.map(node=>mapAniListNodeToTvdb(node,item.tvdbId)));
      rows.filter(row=>row&&!mappedTvdbIds.has(row.id)).forEach(row=>{ mappedTvdbIds.add(row.id); mapped.push(row); });
    }
    const anilistGroup=mapped.length?[{id:'anilist-relations',name:'AniList branches and relations',items:mapped}]:[];
    item.tvdbMeta={...(item.tvdbMeta||{}),anilistId:resolved.id,anilistMatchedTitle:resolved.title,anilistMatchYear:resolved.year,anilistRelatedSeries:anilistGroup,anilistCheckedAt:Date.now()};
    item.tmdbMeta=item.tvdbMeta;
    return item;
  }catch(error){
    console.warn('Optional AniList enrichment failed for',item.tvdbId,error);
    return null;
  }
}

function normalizedSearchText(value){
  return String(value||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
}
function tvdbSearchRelevance(result,query){
  const q=normalizedSearchText(query);
  const title=normalizedSearchText(result.name);
  const aliases=Array.isArray(result.aliases)?result.aliases.map(normalizedSearchText).filter(Boolean):[];
  const qTokens=q.split(/\s+/).filter(Boolean);
  const titleTokens=title.split(/\s+/).filter(Boolean);
  let rank=0;
  if(title===q) rank+=1000000;
  else if(title.startsWith(q)) rank+=500000;
  else if(title.includes(q)) rank+=250000;
  if(aliases.some(alias=>alias===q)) rank+=180000;
  else if(aliases.some(alias=>alias.includes(q))) rank+=70000;
  const matched=qTokens.filter(token=>titleTokens.some(word=>word===token||word.startsWith(token))).length;
  rank+=(matched/Math.max(1,qTokens.length))*50000;
  const popularity=Number(result.searchScore);
  if(Number.isFinite(popularity)&&popularity>0) rank+=Math.log10(popularity+1)*100;
  rank-=Math.max(0,title.length-q.length)*.25;
  return rank;
}
function rankTvdbSearchResults(results,query){
  return results.map((result,index)=>({...result,_sourceOrder:index,_relevance:tvdbSearchRelevance(result,query)}))
    .sort((a,b)=> b._relevance-a._relevance || a._sourceOrder-b._sourceOrder)
    .map(({_sourceOrder,_relevance,...result})=>result);
}
async function searchTv(query){
  const data = await tvdbFetch('/search', { query, type:'series', limit:'6' });
  const raw = Array.isArray(data.data)? data.data: [];
  const mapped = raw.map(r=>{
    let numericId=null;
    if(r.tvdb_id) numericId=parseInt(r.tvdb_id,10);
    else if(r.id && String(r.id).startsWith('series-')) numericId=parseInt(String(r.id).split('-')[1],10);
    else if(r.id) numericId=parseInt(r.id,10);
    const name = pickEnglishTitleFromSearch(r);
    const poster = r.image_url || r.image || null;
    if(!numericId || !name) return null;
    // Capture genre hint if search already includes it — avoids extra /extended fetch
    let genresHint = null;
    if(Array.isArray(r.genres) && r.genres.length) genresHint = r.genres.map(g=> typeof g==='string'? g : g.name).filter(Boolean);
    else if(Array.isArray(r.genre) && r.genre.length) genresHint = r.genre.map(g=> typeof g==='string'? g : g.name).filter(Boolean);
    const primaryType = r.primary_type || r.type || null;
    const aliases = Array.isArray(r.aliases)? r.aliases.map(a=> typeof a==='string'?a:a?.name).filter(Boolean):[];
    const searchScore = Number(r.score);
    let overview = '';
    if(isEnglishText(r.overview)) overview = r.overview;
    else if(r.overviewTranslations && r.overviewTranslations.eng) overview = r.overviewTranslations.eng;
    return { id: numericId, name, poster_path: poster, overview: overview||'', genresHint, primaryType, aliases, searchScore, year:readYear(r.year ?? r.firstAired ?? r.first_aired ?? r.firstAiredDate) };
  }).filter(Boolean);
  return { results: rankTvdbSearchResults(mapped,query) };
}
function tvdbSeriesToAnimeShape(tv){
  const seasons = (tv.seasons||[]).map(s=> ({ seasonNumber:s.seasonNumber, name:s.name, episodeCount:s.episodeCount||0, watched:false }));
  const meta = {
    numberOfSeasons: tv.numberOfSeasons ?? seasons.length,
    numberOfEpisodes: tv.numberOfEpisodes ?? seasons.reduce((a,s)=>a+(s.episodeCount||0),0),
    tvdbStatus: tv.status||'',
    tmdbStatus: tv.status||'',
    episodeRuntime: tv.runtime||null,
    overview: normalizeText(tv.overview,MAX_OVERVIEW_LENGTH),
    // Legacy rating fields remain empty for backup/schema compatibility; ratings are not fetched or displayed.
    score: null,
    tmdbVoteAverage: null,
    tmdbVoteCount: null,
    tmdbRatingCheckedAt: null,
    genres: tv.genres||[],
    relatedSeries: normalizeRelatedSeries(tv.relatedSeries),
    anilistId: normalizeAniListId(tv.anilistId),
    anilistMatchedTitle: '',
    anilistMatchYear: null,
    anilistRelatedSeries: normalizeAniListRelatedSeries(tv.anilistRelatedSeries),
    anilistCheckedAt: null,
    firstAiredYear: readYear(tv.firstAiredYear ?? tv.firstAired ?? tv.year),
    detailsPending: !!tv.detailsPending,
    tvdbRefreshedAt: Date.now(),
  };
  return {
    tvdbId: tv.id,
    tmdbId: tv.id,
    title: tv.name,
    poster: tv.image || null,
    backdrop: tv.image || null,
    seasons,
    tvdbMeta: meta,
    tmdbMeta: meta,
  };
}
function isOfficialTvdbList(list){
  return !!list && (list.isOfficial===true || list.isOfficial===1 || String(list.isOfficial).toLowerCase()==='true');
}
function isGenericTvdbListName(name){
  return /\b(top|best|greatest|popular|trending|favo?u?rites?|recommended|recommendations|must[- ]watch|all[- ]time|of the (year|month)|tvdb)\b/i.test(String(name||''));
}
async function fetchTvdbRelatedSeries(tv, currentId,{fresh=false}={}){
  const listRefs=Array.isArray(tv?.lists)?tv.lists.filter(isOfficialTvdbList).slice(0,4):[];
  const current=normalizeTvdbId(currentId);
  const seen=new Set(current!=null?[current]:[]);
  const groups=[];
  for(const list of listRefs){
    const listId=normalizeTvdbId(list.id);
    if(listId==null) continue;
    try{
      const listData=await fetchTvdbListExtended(listId,{fresh});
      if(!listData) continue;
      const listName=String(listData.name||list.name||'').trim()||'TVDB franchise';
      if(isGenericTvdbListName(listName)) continue;
      const entities=Array.isArray(listData.entities)?listData.entities.slice().sort((a,b)=>(a.order??999999)-(b.order??999999)):[];
      const ids=[];
      for(const entity of entities){
        const id=normalizeTvdbId(entity?.seriesId);
        if(id!=null&&!seen.has(id)&&!ids.includes(id)) ids.push(id);
      }
      const loaded=await Promise.all(ids.slice(0,12).map(async id=>{
        try{
          const series=await fetchTvdbSeriesBase(id,{fresh});
          if(!series||!series.id) return null;
          const title=pickEnglishNameFromExtended(series);
          if(!title) return null;
          return { id, title, poster:series.image||null, year:series.year||'', status:series.status?.name||series.status||'' };
        }catch(e){ console.warn('Could not load related TVDB series',id,e); return null; }
      }));
      const items=loaded.filter(item=>{
        if(!item||seen.has(item.id)) return false;
        seen.add(item.id);
        return true;
      });
      if(items.length) groups.push({ id:listId, name:listName, items });
    }catch(e){ console.warn('Could not load TVDB list',listId,e); }
  }
  return groups;
}
async function getTvDetails(tvdbId,{fast=false,fresh=false}={}){
  const tv = await fetchTvdbSeriesExtended(tvdbId,{fresh});
  if(!tv || !tv.id) throw new Error('TVDB returned invalid data.');
  // Pick English title (avoid Japanese)
  const englishName = pickEnglishNameFromExtended(tv);
  // genres
  const genres = Array.isArray(tv.genres)? tv.genres.map(g=> typeof g==='string'? g: g.name).filter(Boolean):[];
  const overview = pickEnglishOverviewFromExtended(tv);
  const relatedSeriesPromise=fast?Promise.resolve([]):fetchTvdbRelatedSeries(tv,tvdbId,{fresh}).catch(e=>{ console.warn('Related TVDB series lookup failed',e); return []; });
  // seasons — use English season name, fallback to "Season N" if Japanese
  let seasonsRaw = Array.isArray(tv.seasons)
    ? tv.seasons.filter(s=> s.number!==0 && s.type && s.type.type==='official').sort((a,b)=> a.number-b.number)
    : [];
  // The extended record often carries only "Aired Order"/"Season N" here.
  // Resolve generic names through the per-season English translation endpoint,
  // in small batches to avoid a burst of TVDB requests.
  const seasonNames=fast
    ? seasonsRaw.map(s=> seasonDisplayName(s,s.number))
    : [];
  if(!fast){
    for(let i=0;i<seasonsRaw.length;i+=6){
      const batch=seasonsRaw.slice(i,i+6);
      seasonNames.push(...await Promise.all(batch.map(s=> fetchEnglishSeasonName(s))));
    }
  }
  let seasons = seasonsRaw.map((s,i)=> ({ seasonNumber:s.number, name:seasonNames[i] || seasonDisplayName(s, s.number), episodeCount:boundedInteger(s.episodeCount,0,10000,0), _rawId:s.id }));
  // Episode counts — robust pagination (query ?page= vs path /default/{page}) + dedup
  if(!fast){
    try{
      const epCounts={};
    const seenEpisodeIds=new Set();
    let page=0;
    let hasMore=true;
    while(hasMore && page<6){
      let epJson=null;
      let arr=[];
      // Try query-param pagination first (swagger 4.7.10: ?page=0)
      try{
        epJson = await tvdbFetch('/series/'+tvdbId+'/episodes/default', { page:String(page) });
        const eps = epJson.data?.episodes || epJson.data || [];
        arr = Array.isArray(eps)? eps: [];
      }catch(e){ arr=[]; epJson={links:{}}; }
      if(!arr.length && page===0){
        // Fallback: some deployments expect path segment for page 0 as well
        try{
          const alt = await tvdbFetch('/series/'+tvdbId+'/episodes/default/0', {});
          const aeps = alt.data?.episodes || alt.data || [];
          if(Array.isArray(aeps) && aeps.length){ epJson=alt; arr=aeps; }
        }catch(_){}
      }
      if(!arr.length) break;
      let newInPage=0;
      arr.forEach(ep=>{
        const eid = ep.id ?? ep.episodeId ?? null;
        let key;
        if(eid!=null) key='id:'+eid;
        else key='k:'+(ep.seasonNumber ?? ep.season ?? '')+':'+(ep.name ?? '')+':'+(ep.number ?? '');
        if(seenEpisodeIds.has(key)) return;
        seenEpisodeIds.add(key);
        newInPage++;
        const sn = ep.seasonNumber ?? ep.season ?? ep.airedSeason;
        if(typeof sn==='number'&&sn>0) epCounts[sn]=(epCounts[sn]||0)+1;
      });
      // If query returned only duplicates (API ignored ?page=), try path-segment fallback for this page
      if(newInPage===0 && arr.length>0 && page>0){
        try{
          const altJson = await tvdbFetch('/series/'+tvdbId+'/episodes/default/'+page, {});
          const aeps = altJson.data?.episodes || altJson.data || [];
          const altArr = Array.isArray(aeps)? aeps: [];
          if(altArr.length){
            let altNew=0;
            const toAdd=[];
            altArr.forEach(ep=>{
              const eid = ep.id ?? ep.episodeId ?? null;
              let key;
              if(eid!=null) key='id:'+eid;
              else key='k:'+(ep.seasonNumber ?? ep.season ?? '')+':'+(ep.name ?? '')+':'+(ep.number ?? '');
              if(seenEpisodeIds.has(key)) return;
              toAdd.push({key, ep});
              altNew++;
            });
            if(altNew>0){
              toAdd.forEach(({key, ep})=>{
                seenEpisodeIds.add(key);
                const sn = ep.seasonNumber ?? ep.season ?? ep.airedSeason;
                if(typeof sn==='number'&&sn>0) epCounts[sn]=(epCounts[sn]||0)+1;
              });
              newInPage = altNew;
              epJson = altJson;
              arr = altArr;
            }
          }
        }catch(_){}
      }
      if(newInPage===0){
        console.warn('Episode pagination duplicate page', page, '— breaking early');
        break;
      }
      const next = epJson && epJson.links ? epJson.links.next : null;
      hasMore = !!next;
      // If no explicit next but we got a full page, assume more pages exist (TVDB sometimes omits links)
      // We keep page<6 guard as hard cap, so no infinite loop
      page++;
      if(!hasMore) break;
    }
    seasons = seasons.map(s=> ({...s, episodeCount: epCounts[s.seasonNumber] || 0 }));
  }catch(e){
    console.warn('Episode count fallback', e);
  }
  }
  // fallback if no seasons but we have counts
  if(!seasons.length){
    // try to infer from counts? keep empty
  }
  const status = tv.status?.name || tv.status || '';
  const runtime = tv.averageRuntime || tv.runtime || null;
  const relatedSeries=await relatedSeriesPromise;
  return tvdbSeriesToAnimeShape({ id: tv.id, name: englishName, image: tv.image, genres, overview, seasons, numberOfSeasons: seasons.length, numberOfEpisodes: seasons.reduce((a,s)=>a+(s.episodeCount||0),0), status, runtime, year:readYear(tv.firstAired ?? tv.year), firstAiredYear:readYear(tv.firstAired ?? tv.year), anilistId:extractAniListRemoteId(tv), relatedSeries, detailsPending:fast });
}

/* ---------- Animation filter (TVDB genres) ---------- */
// Cache: tvdbId -> boolean (true = Animation/Anime) — memory + IndexedDB
const animationCache = new Map();
async function persistAnimationCacheEntry(tvdbId, isAnim){
  try{
    await idbPut('animationCache', { id: Number(tvdbId), isAnimated: isAnim, checkedAt: Date.now() });
  }catch(e){ console.warn('Could not persist animation cache', e); }
}
async function isAnimatedForId(tvdbId){
  if(animationCache.has(tvdbId)) return animationCache.get(tvdbId);
  // Check IDB fallback (in case loaded after boot race)
  try{
    const row = await idbGet('animationCache', Number(tvdbId));
    if(row && typeof row.isAnimated==='boolean' && (Date.now() - (row.checkedAt||0) < 60*24*60*60*1000)){
      animationCache.set(tvdbId, row.isAnimated);
      return row.isAnimated;
    }
  }catch(e){}
  try{
    const tv = await fetchTvdbSeriesExtended(tvdbId);
    const genres = Array.isArray(tv.genres) ? tv.genres.map(g=> typeof g==='string'? g : g.name).filter(Boolean) : [];
    const isAnim = genres.some(g=> /^(animation|anime)$/i.test(String(g).trim()));
    animationCache.set(tvdbId, isAnim);
    persistAnimationCacheEntry(tvdbId, isAnim);
    return isAnim;
  }catch(e){
    console.warn('Genre check failed for', tvdbId, e);
    // Don't persist failures — transient 500 would hide title from Anime tab for 60 days otherwise
    // Cache in memory for this session only to avoid tight retry loop, but allow retry next reload
    animationCache.set(tvdbId, false);
    return false;
  }
}
function resultMatchesTab(result,tab){
  const isAnim=animationCache.get(result.id);
  if(isAnim==null) return true; // render first; background verification may refine it
  return tab==='anime' ? isAnim===true : isAnim===false;
}
function seedAnimationHints(results){
  results.forEach(r=>{
    if(animationCache.has(r.id)) return;
    if(Array.isArray(r.genresHint) && r.genresHint.length){
      const isAnim=r.genresHint.some(g=> /^(animation|anime)$/i.test(String(g).trim()));
      animationCache.set(r.id,isAnim);
      persistAnimationCacheEntry(r.id,isAnim);
    }
  });
}
function filterResultsByTab(results,tab,searchVer){
  if(!results.length) return results;
  seedAnimationHints(results);
  const initial=results.slice(0,6).filter(r=> resultMatchesTab(r,tab));
  verifySearchGenresInBackground(results.slice(0,6),tab,searchVer);
  return initial;
}
async function verifySearchGenresInBackground(results,tab,searchVer){
  const needed=results.filter(r=> !animationCache.has(r.id));
  for(let i=0;i<needed.length;i+=4){
    const batch=needed.slice(i,i+4);
    await Promise.all(batch.map(r=> isAnimatedForId(r.id)));
    if(typeof searchVer==='number' && searchVer!==searchRequestVersion) return;
    if(typeof searchVer==='number' && searchVer===searchRequestVersion){
      state.searchResults=results.filter(r=> resultMatchesTab(r,tab));
      updateSearchResults();
    }
  }
}

function posterSrc(path){
  if(!path) return PLACEHOLDER_SVG;
  const s=String(path).trim();
  if(!s) return PLACEHOLDER_SVG;

  if(s.startsWith('/')) return 'https://artworks.thetvdb.com'+s;
  return s;
}

const EMPTY_STATUS_MESSAGES = {
  watching: 'Nothing? I know you are studying😏',
  planned: 'You have nothing planned😳? What are you doing?',
  comeback: 'There are no returning shows🥱',
  returning: 'There are no returning shows🥱',
  finished: 'What? You haven\'t finished anything? Seriously?🫪',
  dropped: 'Oh, nothing dropped. You picked good shows then🙂',
};
const SORT_OPTIONS = [
  { key:'az', label:'A–Z' },
  { key:'added', label:'Recently Added' },
  { key:'updated', label:'Recently Updated' },
  { key:'rating', label:'Rating' },
];
const RATING_SORT_ORDER = { hot:0, good:1, okay:2, bad:3 };
function compareByRating(a,b){
  const ra = RATING_SORT_ORDER.hasOwnProperty(a.rating)? RATING_SORT_ORDER[a.rating]:4;
  const rb = RATING_SORT_ORDER.hasOwnProperty(b.rating)? RATING_SORT_ORDER[b.rating]:4;
  return ra-rb || a.title.localeCompare(b.title);
}
function itemRuntimeMinutes(a){
  const m=a.tvdbMeta&&typeof a.tvdbMeta.episodeRuntime==='number'&&a.tvdbMeta.episodeRuntime>0?a.tvdbMeta.episodeRuntime:null;
  if(m) return m;
  return a.mediaType==='show'? SERIES_FALLBACK_RUNTIME_MIN: ANIME_FALLBACK_RUNTIME_MIN;
}
function watchedMinutesForItem(a){
  const per=itemRuntimeMinutes(a);
  return (a.seasons||[]).reduce((s,season)=> s+(season.watched?(season.episodeCount||0)*per:0),0);
}
function watchedMinutesForLibrary(items){ return items.reduce((s,a)=> s+watchedMinutesForItem(a),0); }
function pluralUnit(n,u){ return n+' '+u+(n===1?'':'s'); }
function formatWatchedTime(tm){ const h=Math.floor(tm/60), m=tm%60; return pluralUnit(h,'hour')+' '+pluralUnit(m,'minute'); }
function activeLibrary(){ return state.activeTab==='anime'? state.library: state.showLibrary; }
function activeStatuses(){ return state.activeTab==='anime'? STATUSES: SHOW_STATUSES; }
function activeStatusMap(){ return state.activeTab==='anime'? STATUS_MAP: SHOW_STATUS_MAP; }
function activeSortKey(){ return state.activeTab==='anime'? state.sortBy.anime: state.sortBy.shows; }
function sortItems(items){
  const mode=activeSortKey();
  const out=items.slice();
  if(mode==='added') out.sort((x,y)=> (y.addedAt||0)-(x.addedAt||0));
  else if(mode==='updated') out.sort((x,y)=> (y.updatedAt||0)-(x.updatedAt||0));
  else if(mode==='rating') out.sort(compareByRating);
  else out.sort((x,y)=> x.title.localeCompare(y.title));
  return out;
}
function hasUnseenTitleUpdate(item){
  return !!item && state.notifications.some(n=> !n.titleSeen && n.animeId===item.id && n.mediaType===item.mediaType);
}
function markTitleUpdatesSeen(item){
  const matching=state.notifications.filter(n=> !n.titleSeen && n.animeId===item.id && n.mediaType===item.mediaType);
  if(!matching.length) return;
  matching.forEach(n=>{
    n.titleSeen=true;
    saveNotification(n).catch(()=>{ n.titleSeen=false; });
  });
}
function updateBellBadge(){
  const badge=document.getElementById('bell-badge');
  const n=state.notifications.filter(x=> !x.read).length;
  if(n>0){ badge.hidden=false; badge.textContent=n>99?'99+':String(n); } else badge.hidden=true;
}
function timeAgo(ts){
  const d=Date.now()-ts;
  const m=Math.round(d/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.round(m/60);
  if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}
